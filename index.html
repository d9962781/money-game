// ---------- 交易 ----------
function buyStock(p, id, qty) {
  qty = Math.floor(qty); const price = G.market.prices[id];
  if (!(qty > 0)) return { ok: false, msg: '請輸入要買的股數' };
  const gross = price * qty, fee = p.feeFree ? 0 : Math.max(20, gross * 0.001425), total = gross + fee;
  if (total > p.cash) return { ok: false, msg: `現金不足，需要 ${money(total)}` };
  p.cash -= total; p.stocks[id] += qty; p.cost[id] += total;
  IO.log(`${p.name} 買進 ${STOCK_MAP[id].name} ${qty.toLocaleString()} 股`, p.isHuman ? 'me' : '');
  return { ok: true, msg: `買進 ${STOCK_MAP[id].name} ${qty.toLocaleString()} 股，共 ${money(total)}（手續費 ${money(fee)}）` };
}
function sellStock(p, id, qty) {
  qty = Math.floor(qty); const have = p.stocks[id];
  if (!(qty > 0)) return { ok: false, msg: '請輸入要賣的股數' };
  if (qty > have) return { ok: false, msg: `你只有 ${have.toLocaleString()} 股` };
  const price = G.market.prices[id], gross = price * qty, fee = p.feeFree ? 0 : Math.max(20, gross * 0.001425), tax = gross * 0.003;
  const costPart = p.cost[id] * qty / have, get = gross - fee - tax;
  p.cash += get; p.stocks[id] -= qty; p.cost[id] -= costPart;
  IO.log(`${p.name} 賣出 ${STOCK_MAP[id].name} ${qty.toLocaleString()} 股`, p.isHuman ? 'me' : '');
  return { ok: true, msg: `賣出 ${qty.toLocaleString()} 股，入帳 ${money(get)}（${get - costPart >= 0 ? '獲利' : '虧損'} ${money(Math.abs(get - costPart))}，含證交稅 ${money(tax)}）` };
}
function buyBond(p, type, units) {
  units = Math.floor(units);
  if (!(units > 0)) return { ok: false, msg: '請輸入單位數' };
  const cost = units * BOND_FACE;
  if (cost > p.cash) return { ok: false, msg: `現金不足，需要 ${money(cost)}` };
  const bonus = p.bondBonus && type === 'GOV' ? 0.003 : 0;
  const coupon = bondYield(type) + bonus;
  p.cash -= cost; p.bonds.push({ type, units, coupon, yearsLeft: BOND_TYPES[type].years });
  IO.log(`${p.name} 買進${BOND_TYPES[type].name} ${money(cost)}`, p.isHuman ? 'me' : '');
  return { ok: true, msg: `買進${BOND_TYPES[type].name} ${units} 單位，票面利率 ${(coupon * 100).toFixed(2)}%` };
}
function sellBond(p, i) {
  const l = p.bonds[i]; if (!l) return { ok: false, msg: '找不到這筆債券' };
  const get = bondUnitPrice(l) * l.units; p.cash += get; p.bonds.splice(i, 1);
  IO.log(`${p.name} 賣出${BOND_TYPES[l.type].name}`, p.isHuman ? 'me' : '');
  return { ok: true, msg: `賣出${BOND_TYPES[l.type].name}，入帳 ${money(get)}（面額 ${money(l.units * BOND_FACE)}）` };
}
function openFut(p, type, dir, qty) {
  qty = Math.floor(qty);
  if (!(qty > 0)) return { ok: false, msg: '請輸入口數' };
  const margin = futMarginPer(type) * qty;
  if (margin > p.cash) return { ok: false, msg: `保證金不足，需要 ${money(margin)}` };
  p.cash -= margin; p.futures.push({ type, dir, qty, entry: futPrice(type), margin, lastPnl: null });
  IO.log(`${p.name} ${dir > 0 ? '做多' : '做空'}${FUTURES[type].name} ${qty} 口`, p.isHuman ? 'me' : '');
  return { ok: true, msg: `${dir > 0 ? '做多' : '做空'} ${qty} 口，存入保證金 ${money(margin)}。明年行情變動時結算損益。` };
}
function closeFut(p, i) {
  const f = p.futures[i]; if (!f) return { ok: false, msg: '找不到這筆部位' };
  p.cash += f.margin; p.futures.splice(i, 1);

function buyFx(p, cur, twd) {

  p.cash -= twd; p.fx[cur] += amt; p.fxCost[cur] += twd;
  IO.log(`${p.name} 換匯買進${CURRENCIES[cur].name}`, p.isHuman ? 'me' : '');
  return { ok: true, msg: `用 ${money(twd)} 換到 ${CURRENCIES[cur].name} ${amt.toLocaleString(undefined, { maximumFractionDigits: 0 })}` };
}
function sellFx(p, cur, amt) {
  if (!(amt > 0)) return { ok: false, msg: '請輸入外幣金額' };
  if (amt > p.fx[cur] + 1e-6) return { ok: false, msg: '持有外幣不足' };
  amt = Math.min(amt, p.fx[cur]);
  const twd = amt * fxSellRate(cur, p), costPart = p.fxCost[cur] * amt / p.fx[cur];
  p.cash += twd; p.fx[cur] -= amt; p.fxCost[cur] -= costPart;
  IO.log(`${p.name} 把${CURRENCIES[cur].name}換回台幣`, p.isHuman ? 'me' : '');
  return { ok: true, msg: `換回台幣 ${money(twd)}（匯兌${twd - costPart >= 0 ? '收益' : '損失'} ${money(Math.abs(twd - costPart))}）` };
}
function repay(p, kind, amt) {
  const key = kind === 'credit' ? 'credit' : 'studentLoan';
  amt = Math.min(amt, p[key], p.cash);
  if (!(amt > 0)) return { ok: false, msg: '沒有可以還的金額' };
  p.cash -= amt; p[key] -= amt; if (p[key] < 1) p[key] = 0;
  IO.log(`${p.name} 提前還款 ${money(amt)}`, p.isHuman ? 'me' : '');
  return { ok: true, msg: `還款 ${money(amt)}` };
}
function buyProp(p, idx, mode) {
  const price = propMarketPrice(idx);
  const loan = mode === 'loan' ? price * 0.8 : 0;
  p.cash -= price * 1.03 - loan;
  p.props.push({ tile: idx, value: price, cost: price, level: 0, loan, years: loan ? 30 : 0 });
  G.owner[idx] = p.id;
  IO.log(`${p.name} 買下「${TILES[idx].name}」`, 'good');
}
function sellProp(p, i) {
  const pr = p.props[i]; if (!pr) return { ok: false, msg: '找不到這筆房產' };
  const get = pr.value * 0.97 - pr.loan;
  p.cash += get; delete G.owner[pr.tile]; p.props.splice(i, 1);
  IO.log(`${p.name} 賣掉「${TILES[pr.tile].name}」`, p.isHuman ? 'me' : '');
  return { ok: true, msg: `賣出「${TILES[pr.tile].name}」，清償房貸後入帳 ${money(get)}` };
}
function sellBiz(p, i) {
  const b = p.biz[i]; if (!b) return { ok: false, msg: '找不到這個事業' };
  const get = bizValue(b); p.cash += get; p.biz.splice(i, 1);
  IO.log(`${p.name} 頂讓「${bizName(b)}」`, p.isHuman ? 'me' : '');
  return { ok: true, msg: `頂讓「${bizName(b)}」，入帳 ${money(get)}` };
}

function effectHints(ev) {

  add('大盤', ev.idx || 0);

  Object.entries(ev.sec || {}).forEach(([k, v]) => add(secName[k], v));
  if (ev.rate) out.push({ label: ev.rate > 0 ? '利率上升' : '利率下降', up: ev.rate > 0, neutral: true });
  add('黃金', ev.gold || 0); add('美元', ev.usd || 0); add('日圓', ev.jpy || 0); add('歐元', ev.eur || 0); add('房價', ev.prop || 0);
  const bizName = { store: '實體店面', online: '網路生意', tech: '科技新創' };

// ---------- 年度開始：大事件與市場變動 ----------
async function startHalf() {
  const m = G.market;
  if (G.half === 1) return secondHalf();
  G.round++;
  const ev = m.next; m.event = ev; m.recentEvents = [ev.id, ...m.recentEvents].slice(0, 5); m.next = drawEvent();
  m.comp = m.nextComp; m.nextComp = drawCompanyNews();

  G.players.forEach(p => { p.knowsNext = false; p.rumor = null; p.forecast = null; p.compHint = null; p.reaction = null; });
  m.yearOpen = {}; ASSETS.forEach(a => m.yearOpen[a] = assetPrice(a));
  const plan = planYear(ev, m.comp, G.round); m.plan = plan; addMarks(plan, m.comp);
  const acc = G.players.map(() => ({ st: Object.fromEntries(STOCKS.map(s => [s.id, 0])), bonds: 0, fx: 0, props: 0, fut: 0, other: [] }));

// 套用一段月份的行情，中途遇到事件爆發就讓玩家當場反應
async function runMonths(from, to) {
  const m = G.market, plan = m.plan, ev = plan.ev, acc = m.acc, em = plan.em;
  const step = (a, b) => { const snap = G.players.map(markValue); applyMonths(plan, a, b); setYearReturns(); G.players.forEach((p, i) => addDiff(acc[i], snap[i], markValue(p))); };
  if (em >= from && em <= to) {
    step(from, em);
    if (ev.react) {
      IO.log(`【${yearLabel(G.round)} 年 ${em + 1} 月】${ev.name}`, 'news');
      for (const p of G.players) await reactTo(p, ev, plan, acc[p.id]);
    }
    if (em < to) step(em + 1, to);
  } else step(from, to);
}

// 下半年：走完剩下的月份，並結算一整年的市場影響
async function secondHalf() {
  const m = G.market, ev = m.event, plan = m.plan, acc = m.acc, notes = m.notes;
  await runMonths(6, 11);
  const snap = G.players.map(markValue);
  m.inflRate = 0.02 + (ev.infl || 0); m.infl *= 1 + m.inflRate;
  m.propRet = 0.02 + (ev.prop || 0) + gauss() * 0.02; m.propIdx *= 1 + m.propRet;
  m.bizMod = ev.biz || {}; m.sick = ev.sick || 0;
  G.players.forEach(p => { p.props.forEach(x => { x.value *= 1 + m.propRet + gauss() * 0.01; }); ageItems(p); ageDreams(p); });
  G.players.forEach((p, i) => addDiff(acc[i], snap[i], markValue(p)));
  IO.log(`【${yearLabel(G.round)} 年】${ev.name}。加權指數全年 ${pct(m.ret.IDX)}，央行利率 ${(m.rate * 100).toFixed(2)}%`, 'news');
  m.comp.forEach(c => IO.log(`${c.month + 1} 月　${STOCK_MAP[c.stock].name}：${c.text}`, 'news'));

  for (const p of G.players) {
    const a = acc[p.id], N = notes[p.id];
    const note = (t, b) => { N.push({ t, b }); IO.log(`${p.name}：${t}`, p.isHuman ? 'me' : ''); };
    for (const lot of p.bonds.slice()) {
      const pr = lot.type === 'HY' ? (ev.hyDefault || 0) : lot.type === 'CORP' ? (ev.corpDefault || 0) : 0;
      if (pr > 0 && R() < pr) {
        const val = bondUnitPrice(lot) * lot.units, rec = lot.units * BOND_FACE * 0.4;
        p.cash += rec; a.bonds -= val - rec; p.bonds.splice(p.bonds.indexOf(lot), 1);
        note('債券違約', `你持有的${BOND_TYPES[lot.type].name}，發行公司還不出錢了，只拿回 ${money(rec)}（本金的四成）。<small>高利息的背後，就是比較高的違約風險。</small>`);
      }
    }
    for (const f of p.futures.slice()) {
      const price = futPrice(f.type), pnl = (price - f.entry) * FUTURES[f.type].mult * f.qty * f.dir;
      f.margin += pnl; f.entry = price; f.lastPnl = pnl; a.fut += pnl;
      const init = futMarginPer(f.type) * f.qty, name = `${FUTURES[f.type].name}${f.dir > 0 ? '多單' : '空單'} ${f.qty} 口`;
      if (f.margin < init * 0.75) {
        const need = init - f.margin;
        if (p.cash >= need) { p.cash -= need; f.margin += need; note('期貨保證金追繳', `${name}今年虧損 ${money(-pnl)}，保證金低於維持水準，已從現金補繳 ${money(need)}。<small>期貨槓桿大，要預留補繳保證金的現金。</small>`); }
        else { p.cash += f.margin; p.futures.splice(p.futures.indexOf(f), 1); note('期貨被強制平倉', `${name}今年虧損 ${money(-pnl)}，現金不夠補繳保證金，部位被強制平倉${f.margin < 0 ? `，還倒欠 ${money(-f.margin)}` : `，只拿回 ${money(f.margin)}`}。<small>期貨行情反向時，損失可能超過當初投入的保證金。</small>`); }
      }
    }
    if (ev.layoff && p.status === 'employed' && R() < ev.layoff * (1 - p.edu / 160)) {
      const jn = statusLabel(p); p.status = 'unemployed'; p.job = null; p.salary = 0; ensurePlan(p);
      note('被裁員了', `景氣不佳、公司縮編，你失去了「${jn}」的工作。輪到你時可以重新找工作，這段期間要靠預備金撐住。`);
    }
    if (ev.salary && p.status === 'employed') { p.salary *= 1 + ev.salary; note(ev.salary > 0 ? '景氣好，公司調薪' : '景氣差，公司減薪', `年薪${ev.salary > 0 ? '調升' : '調降'} ${Math.abs(ev.salary * 100)}%，現在是 ${money(p.salary)}。`); }
    if (ev.salaryLow && p.status === 'employed' && JOBS.find(j => j.id === p.job).salary <= 46) { p.salary *= 1 + ev.salaryLow; note('基本工資調漲', `你的年薪跟著調升 ${ev.salaryLow * 100}%，現在是 ${money(p.salary)}。`); }
    if (ev.propDamage && p.props.length) { const c = p.props.reduce((s, x) => s + x.value * ev.propDamage, 0); p.cash -= c; a.other.push({ label: '房屋修繕', v: -c }); note('房子受損需要修繕', `名下房產受損，修繕花了 ${money(c)}。`); }
    if (ev.kidAid && p.kids.length) { const v = p.kids.length * ev.kidAid * WAN; p.cash += v; a.other.push({ label: '育兒補助', v }); note('領到育兒補助', `${p.kids.length} 個孩子共領到 ${money(v)}。`); }
    if (ev.taxRefund && p.status === 'employed') { const v = p.salary * ev.taxRefund; p.cash += v; a.other.push({ label: '政府退稅', v }); note('領到退稅', `退稅 ${money(v)}。`); }
    m.comp.forEach(c => { if (p.stocks[c.stock] > 0) N.push({ t: `你持有的${STOCK_MAP[c.stock].name}：${c.text}`, b: `${c.month + 1} 月傳出這個消息，股價受到${c.eff > 0 ? '激勵' : '重挫'}。` }); });
    const items = [];
    STOCKS.forEach(s => { if (Math.abs(a.st[s.id]) >= 1) items.push({ label: s.name, v: a.st[s.id] }); });
    if (Math.abs(a.bonds) >= 1) items.push({ label: '債券', v: a.bonds });
    if (Math.abs(a.fx) >= 1) items.push({ label: '外幣（匯率變動）', v: a.fx });

    if (Math.abs(a.fut) >= 1) items.push({ label: '期貨', v: a.fut });
    items.push(...a.other);
    p.yearImpact = { items, total: items.reduce((s, x) => s + x.v, 0), recap: reactionRecap(p), notes: N };
  }
  const me = G.players.find(p => p.isHuman);
  if (me && IO.yearReport) await IO.yearReport(me, ev);
  IO.render();
}

// ---------- 玩家回合 ----------
async function playerTurn(p) {
  IO.setPhase(p, 'start');
  p.feeFree = p.bondBonus = p.fxDiscount = p.bizDiscount = false;
  p.dateActs = [];
  ensurePlan(p);
  if (!p.isHuman) aiPlan(p);
  IO.render();
  for (const pd of p.pending.slice()) {
    pd.years--;
    if (pd.years <= 0) {
      p.pending.splice(p.pending.indexOf(pd), 1);
      const res = await PENDING[pd.id](p, pd.data);
      if (res) await tell(p, `結果揭曉｜${res[0]}`, res[1], `${p.name}：${res[0]}`);
    }
  }
  if (R() < 0.42) { const fate = R() < 0.5; await drawCard(p, fate ? FATE : CHANCE, fate ? '命運' : '機會'); }
  await romanceStep(p);
  if (p.status === 'student' && !p.club && G.half === 1) await chooseClub(p);
  if (p.status === 'student' && !p.internTried && p.studyLeft <= 2 && !p.gradSchool && G.half === 1) await internshipOffer(p);
  if (p.status === 'unemployed' && !p.retired && G.half === 1) await jobOffers(p, 'annual');
  if (G.half === 1) await competitorEvent(p);
  if (p.edu >= (p.club === 'invest' ? 55 : 70) && !p.rumor && R() < 0.35) {
    p.rumor = G.market.next.rumor;
    if (p.isHuman) IO.log(`你看財經新聞時注意到：「${p.rumor}」`, 'hint');
  }
  IO.setPhase(p, 'roll'); IO.render();
  if (p.isHuman) await IO.waitFor('roll'); else await IO.wait(350);
  const d = 1 + Math.floor(R() * 6); IO.dice(d, p);
  let passed = false;
  for (let k = 0; k < d; k++) { p.pos = (p.pos + 1) % TILES.length; if (p.pos === 0) passed = true; IO.move ? IO.move() : IO.render(); await IO.wait(p.isHuman ? 150 : 90); }
  IO.log(`${p.name} 擲出 ${d} 點，來到「${TILES[p.pos].name}」`);
  if (p.partner && p.partner.pending) {
    p.partner.steps += d;
    if (p.partner.steps >= STAGES[p.partner.stage].steps) await milestoneEvent(p);
  }
  IO.setPhase(p, 'tile');
  if (passed) await quiz(p, '經過起點：理財小測驗', true);
  await tileAction(p);
  if (!p.isHuman) { aiManage(p); aiLifestyleStep(p); aiDateStep(p); if (G.half === 1) { await aiBusinessStep(p); await aiEndgameStep(p); } }
  IO.setPhase(p, 'free'); IO.render();
  if (p.isHuman) await IO.waitFor('end'); else await IO.wait(200);
  IO.setPhase(p, 'settle');
  await settleTurn(p);
  IO.render();
}

async function quiz(p, title, reward) {
  const seen = p.quizSeen || (p.quizSeen = []);
  let q = null;
  for (let i = 0; i < 30; i++) { const c = QUIZ[Math.floor(R() * QUIZ.length)]; if (!seen.includes(c.q)) { q = c; break; } }
  if (!q) { seen.length = 0; q = QUIZ[Math.floor(R() * QUIZ.length)]; }
  seen.unshift(q.q); if (seen.length > Math.min(14, QUIZ.length - 3)) seen.pop();
  const v = await ask(p, { title, body: q.q, options: q.o.map((t, i) => ({ label: t, value: i })), ai: pp => (R() < 0.35 + pp.edu / 160 ? q.a : (q.a + 1) % q.o.length) });
  const ok = v === q.a, cash = reward ? 1 * WAN : 0;
  if (ok) { p.edu = clamp(p.edu + 3, 0, 100); p.cash += cash; }
  await tell(p, ok ? '答對了' : '答錯了', (ok ? `學識 +3${cash ? `，獲得獎金 ${money(cash)}` : ''}。` : `正確答案是「${q.o[q.a]}」。`) + `<br><br>${q.e}`, `${p.name} 理財測驗${ok ? '答對' : '答錯'}`);
}

async function jobOffers(p, mode) {
  const all = JOBS.map(j => ({ j, ok: canApply(p, j) }));
  let list;
  if (mode === 'bank') list = all;
  else {
    const n = Math.max(2, (mode === 'grad' ? 2 : 1) + Math.floor(netEff(p) / 30));
    const aff = all.filter(x => x.ok && hasAffinity(p, x.j.id));
    const rest = shuffle(all.filter(x => x.ok && !aff.includes(x)));
    list = [...aff, ...rest].slice(0, Math.max(n, aff.length));
    if (!list.length) list = all.filter(x => x.ok);
  }
  list.sort((a, b) => a.j.salary - b.j.salary);
  const opts = list.map(({ j, ok }) => {
    const cfg = puzzleSetup(p, j), aff = hasAffinity(p, j.id);
    return { label: `${j.name}　年薪約 ${money(jobSalary(p, j))}`, value: j.id, disabled: !ok || j.id === p.job,
      hint: j.id === p.job ? '目前的工作' : ok ? `面試 ${cfg.stages} 關　${cfg.retries ? `可重試 ${cfg.retries} 次` : '沒有重試機會'}${aff ? '　你的專長領域，題目較簡單' : ''}` : `還需要：${applyBlock(p, j)}` };
  });
  Object.entries(LICENSES).forEach(([jid, L]) => {
    if (p.licenses[jid] || (mode !== 'bank' && !hasAffinity(p, jid))) return;
    const cd = (p.licenseCooldown[jid] || 0) > G.round, fee = L.fee * WAN * G.market.infl;
    opts.push({ label: `報考${L.name}（報名費 ${money(fee)}）`, value: 'lic:' + jid,
      disabled: cd || p.edu < L.edu || p.cash < fee,
      hint: cd ? '今年剛落榜，明年才能再考' : p.edu < L.edu ? `需要學識 ${L.edu}（目前 ${p.edu}）` : `${L.stages} 科　考過才能應徵「${L.job}」　${L.desc}` });
  });
  opts.push({ label: p.status === 'employed' ? '維持目前的工作' : '暫時不找工作', value: null });
  const title = mode === 'bank' ? '人力銀行' : mode === 'grad' ? '畢業求職' : '今年收到的工作機會';
  const body = mode === 'bank' ? '學識決定你能應徵什麼工作、面試題有多難、能重試幾次；人脈可能讓你少考一關。沒通過也可能被降級錄取。' : '人脈越廣，收到的面試機會越多。';
  const v = await ask(p, { title, body, options: opts, ai: pp => aiPickJob(pp, list, opts) });
  if (!v) return;
  if (String(v).startsWith('lic:')) return licenseExam(p, v.slice(4));
  const j = JOBS.find(x => x.id === v);
  const before = p.salary;
  const r = await applyJob(p, j, `${j.name}　面試`);
  if (r === 'fail' && p.status === 'employed') p.salary = before;
}
function aiPickJob(p, list, opts) {
  const lic = (opts || []).filter(o => String(o.value).startsWith('lic:') && !o.disabled);
  if (lic.length && R() < 0.75) {
    const best = lic.map(o => ({ o, j: JOBS.find(x => x.id === o.value.slice(4)) }))
      .filter(x => x.j.salary * WAN * G.market.infl > p.salary * 1.1)
      .sort((a, b) => b.j.salary - a.j.salary)[0];
    if (best) return best.o.value;
  }
  const ok = list.filter(x => x.ok && x.j.id !== p.job); if (!ok.length) return null;
  const best = ok.reduce((a, b) => (jobSalary(p, b.j) > jobSalary(p, a.j) ? b : a));
  const s = jobSalary(p, best.j);
  if (p.status !== 'employed') { const bizP = p.biz.reduce((t, b) => t + (b.lastProfit || 0), 0); return bizP > s ? null : best.j.id; }
  return s > p.salary * 1.1 ? best.j.id : null;
}

async function tileAction(p) {
  const t = TILES[p.pos], m = G.market, infl = m.infl;
  switch (t.t) {
    case 'prop': return propTile(p, p.pos);
    case 'chance': return drawCard(p, CHANCE, '機會');
    case 'fate': return drawCard(p, FATE, '命運');
    case 'stock': {
      p.feeFree = true; p.rumor = m.next.rumor;
      let hint = '最近各家公司都沒有特別的消息。';
      if (m.nextComp.length) { const c = m.nextComp[Math.floor(R() * m.nextComp.length)]; p.compHint = { stock: c.stock, up: c.eff > 0 }; hint = `聽說${STOCK_MAP[c.stock].name}明年可能會有${c.eff > 0 ? '好消息' : '壞消息'}。`; }
      return openTradeFromTile(p, 'stock', '證券交易所', `本回合買賣股票<b>免手續費</b>。<br><br>營業員小聲說：「${hint}另外，${p.rumor}」<small>傳聞不一定可靠，要自己判斷。</small>`);
    }
    case 'futures':
      return openTradeFromTile(p, 'futures', '期貨交易所', '期貨只要付一成保證金就能交易整口合約，等於十倍槓桿。看漲可以做多，看跌可以做空。<br><small>行情反向時虧損也會放大，保證金不足會被追繳，甚至強制平倉。</small>');
    case 'fx':
      p.fxDiscount = true;
      return openTradeFromTile(p, 'fx', '外匯銀行', '本回合換匯享<b>匯差減半</b>優惠。<br><small>外幣存款可以賺利差，但要承擔匯率漲跌的風險。</small>');
    case 'bond':

async function drawCard(p, deck, label) {
  const recent = p.recent[label] || (p.recent[label] = []);
  const pool = deck.map((c, i) => ({ c, i, w: (c.w || 1) * (c.when ? 1.4 : 1) * (recent.includes(i) ? 0.08 : 1) })).filter(x => !x.c.when || x.c.when(p));
  const x = wpick(pool);
  recent.unshift(x.i); if (recent.length > 6) recent.pop();
  const res = await x.c.run(p);
  if (res) await tell(p, `${label}｜${res[0]}`, res[1], `${p.name} 抽到${label}：${res[0]}`);
}

async function propTile(p, idx) {
  const t = TILES[idx], ownerId = G.owner[idx];
  if (ownerId == null) {
    const price = propMarketPrice(idx), down = price * 0.23, loan = price * 0.8, pay = amort(loan, mortRate(), 30);
    const cf = cashflow(p), income = cf.totA + cf.totP;
    const loanOK = p.status !== 'student' && mortgagePay(p) + pay <= income * 0.5;
    const opts = [
      { label: `貸款八成買下　準備 ${money(down)}`, value: 'loan', disabled: p.cash < down || !loanOK,
        hint: !loanOK ? (p.status === 'student' ? '學生沒有穩定收入，銀行不核貸' : `每年房貸 ${money(pay)}，超過年收入的一半，銀行不核貸`) : p.cash < down ? `頭期款兩成加稅費，需要 ${money(down)}` : `每年房貸本息約 ${money(pay)}（利率 ${(mortRate() * 100).toFixed(2)}%，30 年）` },
      { label: `全額現金買下　${money(price * 1.03)}`, value: 'cash', disabled: p.cash < price * 1.03, hint: '不用背房貸，但資金全部卡在房子裡' },
      { label: '不買', value: null },

      options: opts, ai: pp => {
        const P = PERSONAS[pp.persona], need = cashflow(pp).rec * P.reserve, rent = price * t.yield;
        if (R() > P.prop * 1.4) return null;
        if (!opts[0].disabled && rent > pay * 1.02 && pp.cash - down > need * 0.6) return 'loan';
        if (!opts[1].disabled && t.yield > 0.048 && pp.cash - price * 1.03 > need * 1.5) return 'cash';
        return null;
      } });
    if (v) buyProp(p, idx, v);
  } else if (ownerId === p.id) {
    const i = p.props.findIndex(x => x.tile === idx), pr = p.props[i], cost = pr.value * 0.12;

    opts.push({ label: `出售（清償房貸後拿回 ${money(pr.value * 0.97 - pr.loan)}）`, value: 'sell' });
    opts.push({ label: '維持現狀', value: null });
    const v = await ask(p, { title: `${t.name}（你的房產）`, body: `市價 ${money(pr.value)}，買進成本 ${money(pr.cost)}，房貸餘額 ${money(pr.loan)}，每年租金 ${money(propRent(pr))}。`,
      options: opts, ai: pp => (pr.level < 2 && pp.cash > cost * 3 ? 'up' : null) });
    if (v === 'up') { p.cash -= cost; pr.level++; pr.value += cost * 0.5; IO.log(`${p.name} 裝修了「${t.name}」`); }
    if (v === 'sell') { const r = sellProp(p, i); if (p.isHuman) await IO.notify('出售完成', r.msg); }
  } else {

  }
}

// ---------- 年度結算 ----------
function applyStats(p, frac) {
  const job = p.job ? JOBS.find(j => j.id === p.job) : null;
  let dE = 0, dN = 0, dH = 1;
  if (p.status === 'student') {
    if (p.plan === 'study') { dE += p.gradSchool ? 12 : 10; dN += 1; }
    else if (p.plan === 'work') { dE += 3; dH -= 3; dN += 2; }
    else if (p.plan === 'gig') { dE += 3; dH -= 4; dN += 2; }
    else { dN += 4; dE += 2; dH += 1; }
    const c = p.club ? CLUBS[p.club] : null;
    if (c) { const k = p.plan === 'club' ? 2 : 1; dE += c.edu * k; dN += c.net * k; dH += c.health * k; }
  } else if (p.status === 'employed') {
    dH -= healthDrain(p); dN += job.id === 'sales' ? 4 : 2;
    if (p.plan === 'overtime') dH -= 6;
    if (p.plan === 'learn') { dE += 7; dH -= 1; } else dE += 1;
  } else if (p.retired) {
    if (p.plan === 'volunteer') { dN += 5; dH += 3; }
    else if (p.plan === 'hobby') { dH += 5; dE += 3; }
    else dH += 7;
  } else {
    if (p.plan === 'learn') dE += 6; else if (p.plan === 'gig') { dH -= 2; dN += 1; } else dH += 6;
  }
  if (p.lifestyle === 'frugal') { dH -= 2; dN -= 1; }
  if (p.lifestyle === 'enjoy') { dH += 5; dN += 3; }
  dH += wellnessGain(p);
  const acc = p.statAcc;
  acc.edu += dE * frac; acc.net += dN * frac; acc.health += dH * frac;
  const take = k => { const v = Math[acc[k] >= 0 ? 'floor' : 'ceil'](acc[k]); acc[k] -= v; return v; };
  p.edu = clamp(p.edu + take('edu'), 0, 100);
  p.net = clamp(p.net + take('net'), 0, 100);
  p.health = clamp(p.health + take('health'), 0, 100);
}

async function settleTurn(p) {
  const m = G.market, annual = G.half === 1, H = 0.5;
  const bizActual = annual ? await settleBusinesses(p) : null;
  const cf = cashflow(p, bizActual);
  p.cash += cf.net * H;
  if (annual) await annualSettle(p);
  applyStats(p, H);
  const sickChance = clamp(0.03 + Math.max(0, 60 - p.health) * 0.012 + Math.max(0, p.age - 45) * 0.004 + (m.sick || 0), 0, 0.6) * (p.wellness.checkup ? 0.5 : 1) * H;
  if (R() < sickChance) {
    const major = R() < 0.3;
    await medical(p, major ? 25 * WAN : 3 * WAN, major ? 12 : 4, major ? '生了一場大病' : '感冒看醫生');
    if (major && p.status === 'employed') { const loss = p.salary * 0.25 * H; p.cash -= loss; IO.log(`${p.name} 請病假，少了 ${money(loss)} 收入`, p.isHuman ? 'me' : ''); }
  }
  await settleRomance(p);
  await checkAchievements(p);
  if (p.cash < 0) {
    const d = -p.cash; p.cash = 0;
    if (p.status === 'student') { p.studentLoan += d; await tell(p, '申請就學貸款', `現金不夠付學費和生活費，申請學貸 ${money(d)}（利率 1.5%，畢業後分 8 年償還）。`, `${p.name} 申請學貸 ${money(d)}`); }
    else { p.credit += d; await tell(p, '現金不足，申請信用貸款', `帳戶透支 ${money(d)}，銀行核貸信用貸款（年利率 8%，每年至少還兩成）。<br><small>高利率負債會吃掉現金流，有閒錢時優先還掉。</small>`, `${p.name} 現金不足，借了信用貸款 ${money(d)}`); }
  }
  p.last = cf;
  if (p.status !== 'student' && cf.totP > 0 && cf.totP >= cf.rec) p.streak++; else p.streak = 0;
  if (annual) p.hist.push({ age: p.age, net: holdings(p).net, passive: cf.totP, rec: cf.rec });
  IO.log(`${p.name} ${p.age} 歲${annual ? '下' : '上'}半年結算：淨收入 ${money(cf.net * H)}，被動收入 ${money(cf.totP)}／經常性支出 ${money(cf.rec)}`, p.isHuman ? 'me' : '');
  if (p.isHuman) IO.settle(p, cf);
  await checkFreedom(p, cf);
}

// 一年一次：貸款攤還、債券到期、子女長大、調薪、長一歲
async function annualSettle(p) {
  p.props.forEach(x => { if (x.loan > 0) { const pay = amort(x.loan, mortRate(), x.years); x.loan = Math.max(0, x.loan - (pay - x.loan * mortRate())); x.years = Math.max(0, x.years - 1); if (x.years === 0) x.loan = 0; } });
  if (p.studentLoan > 0 && p.status !== 'student') { const n = Math.max(1, p.studentLoanYears); const pay = amort(p.studentLoan, 0.015, n); p.studentLoan = Math.max(0, p.studentLoan - (pay - p.studentLoan * 0.015)); p.studentLoanYears = n - 1; if (p.studentLoanYears <= 0 || p.studentLoan < 1) p.studentLoan = 0; }
  if (p.credit > 0) { p.credit *= 0.8; if (p.credit < 100) p.credit = 0; }
  for (const l of p.bonds.slice()) { l.yearsLeft--; if (l.yearsLeft <= 0) { p.cash += l.units * BOND_FACE; p.bonds.splice(p.bonds.indexOf(l), 1); IO.log(`${p.name} 的${BOND_TYPES[l.type].name}到期，拿回本金 ${money(l.units * BOND_FACE)}`); } }
  await kidsGrowUp(p);
  if (p.status === 'employed') { p.salary *= 1.02 + (p.plan === 'overtime' ? 0.01 : 0); p.workYears++; }
  p.age++;
  if (p.status === 'student') { p.studyLeft--; if (p.studyLeft <= 0) await graduate(p); }
}

async function checkFreedom(p, cf) {
  if (p.streak >= G.settings.freedomYears * 2 && p.freedomAge == null) {
    p.freedomAge = p.age;
    if (G.winner == null) G.winner = p.id;
    if (p.isHuman) {
      IO.freedom(p);
      const v = await ask(p, { title: `${p.age} 歲，你達成財富自由了`, body: `被動收入 ${money(cf.totP)} 已經連續 ${G.settings.freedomYears} 年超過經常性支出 ${money(cf.rec)}，你不必再為錢工作。<br><br>你可以就此結束，也可以繼續經營人生，看看到 ${END_AGE} 歲能累積到什麼程度。<br><small>繼續玩的話，最後會比較淨資產和生活品質。</small>`,
        options: [{ label: '就此結束，看結局', value: 1 }, { label: '繼續玩下去', value: 0, hint: `一路玩到 ${END_AGE} 歲` }] });
      if (v) G.over = true;
    } else {
      IO.log(`${p.name} 在 ${p.age} 歲達成財富自由`, 'good');
      const me = G.players.find(x => x.isHuman);
      if (me && me.freedomAge == null) await IO.notify(`${p.name} 達成財富自由`, `${p.name} 在 ${p.age} 歲讓被動收入超過了生活開銷。<br>你還在路上，繼續加油。`);

}

// ---------- 電腦玩家 ----------
function aiPlan(p) {
  const P = PERSONAS[p.persona]; ensurePlan(p);
  if (p.status === 'student') p.plan = P.student;
  else if (p.status === 'employed') p.plan = p.health < 45 ? 'normal' : P.work(p);
  else p.plan = p.cash < 10 * WAN ? 'gig' : p.health < 50 ? 'rest' : p.edu < 60 ? 'learn' : 'gig';
  p.lifestyle = p.health < 40 ? 'normal' : P.lifestyle;
  ensurePlan(p);
}

function aiManage(p) {
  const P = PERSONAS[p.persona], m = G.market;
  const cf = cashflow(p), reserve = Math.max(cf.totE, 10 * WAN) * P.reserve;
  const fc = p.forecast ? p.forecast[0].ev : (p.rumor && p.edu >= 70 ? m.next : null);
  const bearish = !!fc && (fc.idx || 0) <= -0.08, bullish = !!fc && (fc.idx || 0) >= 0.08;
  if (p.compHint && !p.compHint.up && p.stocks[p.compHint.stock] > 0) sellStock(p, p.compHint.stock, p.stocks[p.compHint.stock]);
  if (bearish) {
    STOCKS.forEach(s => { if (s.id !== 'FOOD' && p.stocks[s.id] > 0) sellStock(p, s.id, Math.floor(p.stocks[s.id] * 0.6)); });
    for (let i = p.futures.length - 1; i >= 0; i--) if (p.futures[i].dir > 0) closeFut(p, i);
  }
  for (let i = p.futures.length - 1; i >= 0; i--) { const f = p.futures[i]; if (f.margin > futMarginPer(f.type) * f.qty * 1.5 && R() < 0.5) closeFut(p, i); }
  if (p.credit > 0) {
    for (const s of STOCKS) {
      const spare = p.cash - reserve * 0.3; if (spare >= p.credit) break;
      if (p.stocks[s.id] > 0) sellStock(p, s.id, Math.min(p.stocks[s.id], Math.ceil((p.credit - spare) / m.prices[s.id])));
    }
    const amt = Math.min(p.credit, p.cash - reserve * 0.3); if (amt > 0) repay(p, 'credit', amt);
  }
  let investable = p.cash - reserve;
  if (investable < 3 * WAN) return;
  investable *= bullish ? 0.95 : 0.8;
  if (p.status === 'student') investable *= 0.5;
  for (const [k, w] of Object.entries(P.alloc)) {
    const amt = investable * w;
    if (STOCK_MAP[k]) { const q = Math.floor(amt / (m.prices[k] * 1.003)); if (q > 0) buyStock(p, k, q); }
    else if (k.startsWith('BOND_')) { const u = Math.floor(amt / BOND_FACE); if (u > 0) buyBond(p, k.slice(5), u); }
    else if (k === 'FUT') {
      if (!p.futures.length && amt >= futMarginPer('IDX') * 1.5) openFut(p, 'IDX', bearish ? -1 : 1, 1);
      else if (!p.futures.length && amt >= futMarginPer('GOLD') * 2) openFut(p, 'GOLD', 1, 1);
    }
    else if (CURRENCIES[k] && amt >= WAN) buyFx(p, k, amt);
  }
  if (p.compHint && p.compHint.up) { const q = Math.floor(Math.max(0, p.cash - reserve) * 0.5 / m.prices[p.compHint.stock]); if (q > 0) buyStock(p, p.compHint.stock, q); }
}

// ---------- 主迴圈 ----------
function ranking() {
  return G.players.map(p => ({ p, h: holdings(p), prog: p.last ? p.last.totP / Math.max(1, p.last.rec) : 0, qol: qualityOfLife(p) }))
    .sort((a, b) => {
      const fa = a.p.freedomAge, fb = b.p.freedomAge;
      if (fa != null && fb != null && fa !== fb) return fa - fb;
      if ((fa != null) !== (fb != null)) return fa != null ? -1 : 1;
      return b.h.net - a.h.net;
    });
}
async function runGame() {
  for (const p of G.players) await chooseMajor(p);
  IO.render();
  while (!G.over) {
    await startHalf();
    for (const p of G.players) { if (G.over) break; await playerTurn(p); }
    if (!G.over && G.half === 1 && G.players.every(p => p.age >= END_AGE)) G.over = true;
    G.half = 1 - G.half;
  }
  IO.end(ranking());
}

// ---------- 棋盤 ----------
function tileRC(i) { if (i <= 6) return [7, 7 - i]; if (i <= 12) return [7 - (i - 6), 1]; if (i <= 18) return [1, 1 + (i - 12)]; return [1 + (i - 18), 7]; }
function buildBoard() {
  $('#board').innerHTML = TILES.map((t, i) => {
    const [r, c] = tileRC(i), corner = [0, 6, 12, 18].includes(i);
    const style = `grid-row:${r};grid-column:${c};${t.band ? `--band:${t.band};` : ''}`;
    const inner = t.t === 'prop'
      ? `<div class="band"></div><div class="tname">${t.name}</div><div class="tsub num" data-price="${i}"></div><div class="lvl"></div>`
      : `<div class="band"></div><div class="ticon" aria-hidden="true">${t.icon}</div><div class="tname">${t.name}</div>`;
    return `<div class="tile ${TILE_KIND[t.t] || ''} ${corner ? 'corner' : ''}" id="tile${i}" style="${style}" title="${t.name}">${inner}<div class="tokens"></div></div>`;
  }).join('');
}
function renderBoard() {
  const cur = UI.phase.p;
  TILES.forEach((t, i) => {
    const el = $('#tile' + i);
    const ownerId = G.owner[i];
    el.classList.toggle('owned', ownerId != null);
    if (t.t === 'prop') {
      const pr = ownerId != null ? G.players[ownerId].props.find(x => x.tile === i) : null;
      el.style.setProperty('--owner', ownerId != null ? G.players[ownerId].color : 'transparent');
      el.querySelector('.tsub').textContent = money(pr ? pr.value : propMarketPrice(i));
      el.querySelector('.lvl').textContent = pr && pr.level ? '★'.repeat(pr.level) : '';
    }
    el.classList.toggle('here', !!cur && cur.pos === i);
    if (cur) el.style.setProperty('--turn', cur.color);
    el.querySelector('.tokens').innerHTML = G.players.filter(p => p.pos === i).map(p => `<span class="token" style="--c:${p.color}" title="${esc(p.name)}"></span>`).join('');
  });
}

    <ul class="list">

      <li>財經新聞台：看分析師對明年的三種情境預測（只是機率，不保證發生）</li>
      <li>債券市場：當回合買公債多 0.3% 利息</li>
      <li>外匯銀行：當回合匯差減半</li>
      <li>經過起點：回答理財小測驗</li>
      <li>房產格：可以買下收租，別人停下要付場地使用費</li>
    </ul>
    <p><b>機會和命運卡</b>除了停在格子上會抽，每年開始時也有機會遇到。卡片會依你的狀況出現：有房產才會遇到房客欠租，有卡債才會接到催繳電話。有些決定要等兩三年才揭曉結果，例如借錢給朋友、入股新創。</p>
    <p><b>求職要通過面試關卡。</b>每個職業有專屬的情境題，關卡數依職業難度分 1 到 4 關。學識決定題目難度和可以重試幾次，人脈可能讓你少考一關。全部答對才錄取；沒過但答對比較多關，有機會被降級錄取到比較低階的職位。</p>
    <p><b>大學階段的選擇會影響一輩子。</b>選系決定起始學識、學費，以及哪些職業的面試題對你比較拿手；社團每年累積不同能力；大三後可以爭取實習，實習過的領域面試題會變簡單、起薪多 10%。</p>
    <p><b>創業要經營。</b>選行業、選商圈、定價、決定請幾個員工。收入取決於人流、定價和客層是否搭配、員工夠不夠、品牌力，以及同商圈有幾家同類型的店（包含電腦對手開的店）。獲利穩定會有擴張機會，連續虧損要決定增資、縮編還是收掉，做得好還可能被集團收購。</p>
    <p><b>門面與人脈。</b>「有效人脈」＝你認識的人，但受門面限制（上限 45 + 門面 × 0.55）。門面來自車輛、正裝、精品，效果遞減：一套基本正裝是最划算的投資，愈往上堆效果愈小。部分職業還有門面門檻，例如部門經理。要注意這些都是<b>消費品</b>：車會折舊、名牌轉手有價差、每年還有保養保險費，會墊高你的經常性支出。名錶珠寶則跟著市場行情走，有機會保值。</p>
    <p><b>健康會被工作消耗</b>，壓力大、薪水高、年紀大的消耗都更快。可以在「生活與門面」加入健身房、健檢或私人教練，但這些也是每年的固定支出。</p>
    <p><b>專業證照。</b>醫師、會計師、技術師傅要先考到證照才能應徵，證照考試科目多、有報名費，沒過隔年才能再考。一般工作面試落榜後，同一個職位兩年內不能再投履歷。</p>
    <p><b>離開職場。</b>在「生活」的職涯分頁可以辭職或退休。退休後沒有薪水，但工作不再消耗健康，也有更多時間。自己創業當老闆時，你本人就等於一個人力，可以少請一位員工；請了店長就不算。</p>
    <p><b>夢想清單與成就。</b>資產夠多之後，可以買酒窖、藝術收藏、度假別墅、古董車、遊艇，或成立慈善基金會。這些多半會貶值或要養，但會累積聲望和人生成就，共有 31 項成就，最後還會依你的人生走向給出一個專屬結局，也會計入結局評比。</p>
    <p><b>每回合是半年</b>，走兩回合過一年，年度結算在下半年進行。</p>
    <p><b>感情與家庭。</b>交往分成曖昧期、穩定交往、論及婚嫁三個階段。每半年可以安排最多三項行程來提升好感度（每項各限一次）（傳訊息、吃飯、看電影、去對方喜歡的地方、小旅行、出國），花費和效果都不同，投其所好還有額外加成。好感度到門檻後不會自動前進，要再走幾步路觸發里程碑事件（告白、同居或見家長）才能進入下一階段，每個階段也有好感度上限。好感度每半年會自然下滑，加班或創業會扣更多。到了論及婚嫁階段、好感度夠高才能求婚，婚禮規模自己決定。婚後可以選擇雙薪或一方顧家，生小孩後還要決定讀公立、私立還是國際學校。關係跌到谷底會分手，已婚則可能離婚，財產要分割三成以上，有小孩還要付扶養費。</p>
    <p><b>達成財富自由後</b>可以選擇結束看結局，或繼續玩到 ${END_AGE} 歲。最後的排名先看誰比較早達成財富自由，再比淨資產，同時也會列出生活品質。</p>
    <p><b>學識</b>決定工作機會，70 以上偶爾能提早聽到市場傳聞。<b>人脈</b>影響工作機會和創業成績。<b>健康</b>太低容易生病。現金不夠時會自動借信用貸款（年利率 8%）。</p>
    <p><small>遊戲中的公司、數字皆為虛構和簡化，僅供學習理財觀念，不構成投資建議。</small></p>`);
}

function chartSVG() {
  const W = 640, H = 260, pad = 44;
  const all = G.players.flatMap(p => p.hist.map(x => x.net));
  const ages = G.players[0].hist.map(x => x.age);
  if (ages.length < 2) return '';
  const maxV = Math.max(1, ...all), minV = Math.min(0, ...all);
  const x = a => pad + (a - ages[0]) / (ages[ages.length - 1] - ages[0]) * (W - pad - 12);
  const y = v => H - 28 - (v - minV) / (maxV - minV) * (H - 48);
  const lines = G.players.map(p => `<polyline fill="none" stroke="${p.color}" stroke-width="${p.isHuman ? 3.5 : 2}" points="${p.hist.map(h => `${x(h.age).toFixed(1)},${y(h.net).toFixed(1)}`).join(' ')}"/>`).join('');
  const ticks = [minV, (minV + maxV) / 2, maxV].map(v => `<text x="4" y="${y(v) + 4}" font-size="11" fill="#5B6B78">${money(v)}</text><line x1="${pad}" x2="${W - 12}" y1="${y(v)}" y2="${y(v)}" stroke="#E1E9ED"/>`).join('');
  const ageT = [ages[0], ages[Math.floor(ages.length / 2)], ages[ages.length - 1]].map(a => `<text x="${x(a)}" y="${H - 8}" font-size="11" fill="#5B6B78" text-anchor="middle">${a} 歲</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="各玩家淨資產變化">${ticks}${ageT}${lines}</svg>`;
}

// ================= K 線圖 =================
function fmtPrice(id, v) {
  if (id === 'JPY') return v.toFixed(4);
  if (CURRENCIES[id]) return v.toFixed(2);
  if (id === 'IDX' || id === 'GOLD') return Math.round(v).toLocaleString();
  return v >= 100 ? v.toFixed(1) : v.toFixed(2);
}
function yearCandles(series) {
  const out = [];
  for (const c of series) {
    const last = out[out.length - 1];
    if (last && last.y === c.y) { last.h = Math.max(last.h, c.h); last.l = Math.min(last.l, c.l); last.c = c.c; }
    else out.push({ y: c.y, mo: null, o: c.o, h: c.h, l: c.l, c: c.c });
  }
  return out;
}
const periodLabel = c => (c.mo == null ? `${yearLabel(c.y)} 年` : `${yearLabel(c.y)} 年 ${c.mo + 1} 月`);
function klineSVG(id, { mode = 'month', range = 36, w = 720, h = 260 } = {}) {
  const m = G.market; let full = m.series[id];
  if (!full || !full.length) return '';
  if (mode === 'year') full = yearCandles(full);
  const maN = mode === 'year' ? 5 : 12;
  const ma = full.map((c, i) => (i >= maN - 1 ? full.slice(i - maN + 1, i + 1).reduce((s, x) => s + x.c, 0) / maN : null));
  const start = mode === 'month' && range ? Math.max(0, full.length - range) : 0;
  const data = full.slice(start), maS = ma.slice(start);
  const padL = 6, padR = 62, padT = 18, padB = 22;
  let lo = Math.min(...data.map(c => c.l)), hi = Math.max(...data.map(c => c.h));
  const span = hi - lo || hi * 0.1; lo -= span * 0.05; hi += span * 0.08;
  const n = data.length, slot = (w - padL - padR) / n, bw = Math.max(1.2, Math.min(16, slot * 0.66));
  const X = i => padL + slot * (i + 0.5), Y = v => padT + (hi - v) / (hi - lo) * (h - padT - padB);
  let g = '';
  const lastY = Y(data[data.length - 1].c);
  for (let k = 0; k <= 4; k++) {
    const v = lo + (hi - lo) * k / 4, y = Y(v).toFixed(1);
    g += `<line x1="${padL}" x2="${w - padR}" y1="${y}" y2="${y}" stroke="#E3EAEE"/>${Math.abs(+y - lastY) < 16 ? '' : `<text x="${w - padR + 6}" y="${+y + 4}" font-size="11" fill="#5B6B78">${fmtPrice(id, v)}</text>`}`;
  }
  const idxOf = {}; data.forEach((c, i) => { idxOf[`${c.y}-${c.mo}`] = i; });
  const years = [...new Set(data.map(c => c.y))], step = Math.max(1, Math.ceil(years.length / 8));
  data.forEach((c, i) => {
    if ((mode === 'year' || c.mo === 0) && years.indexOf(c.y) % step === 0) {
      const x = mode === 'year' ? X(i) : X(i) - slot / 2;
      g += `<line x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${padT}" y2="${h - padB}" stroke="#EEF2F4"/><text x="${x.toFixed(1)}" y="${h - 6}" font-size="11" fill="#5B6B78" text-anchor="${mode === 'year' ? 'middle' : 'start'}">${yearLabel(c.y)}</text>`;
    }
  });
  data.forEach((c, i) => {
    const up = c.c >= c.o, col = up ? '#D62839' : '#0B8A57', x = X(i);
    const top = Y(Math.max(c.o, c.c)), bh = Math.max(1, Math.abs(Y(c.o) - Y(c.c)));
    g += `<g><title>${periodLabel(c)}　開 ${fmtPrice(id, c.o)}　高 ${fmtPrice(id, c.h)}　低 ${fmtPrice(id, c.l)}　收 ${fmtPrice(id, c.c)}（${pct(c.c / c.o - 1)}）</title>` +
      `<line x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${Y(c.h).toFixed(1)}" y2="${Y(c.l).toFixed(1)}" stroke="${col}" stroke-width="1.2"/>` +
      `<rect x="${(x - bw / 2).toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" fill="${col}"/>` +
      `<rect x="${(x - slot / 2).toFixed(1)}" y="${padT}" width="${slot.toFixed(1)}" height="${h - padT - padB}" fill="transparent"/></g>`;
  });
  const pts = maS.map((v, i) => (v == null ? null : `${X(i).toFixed(1)},${Y(v).toFixed(1)}`)).filter(Boolean);
  if (pts.length > 1) g += `<polyline fill="none" stroke="#E0A100" stroke-width="1.6" points="${pts.join(' ')}"/>`;
  const groups = {};
  m.marks.filter(k => k.ids.includes(id)).forEach(k => {
    const i = mode === 'year' ? data.findIndex(c => c.y === k.y) : idxOf[`${k.y}-${k.mo}`];
    if (i == null || i < 0) return;
    (groups[i] = groups[i] || []).push(k);
  });
  Object.entries(groups).forEach(([i, ks]) => {
    const x = X(+i), y = Y(data[+i].h) - 5;
    const col = ks.every(k => !k.macro) ? (ks[0].up ? '#D62839' : '#0B8A57') : '#1F2D3A';
    g += `<g><title>${ks.map(k => `${mode === 'year' ? `${yearLabel(k.y)} 年 ${k.mo + 1} 月` : ''}${k.text}`).join('\n')}</title><path d="M${x.toFixed(1)},${y.toFixed(1)} l-5,-8 h10z" fill="${col}"/></g>`;
  });
  const last = data[n - 1], ly = Y(last.c);
  g += `<line x1="${padL}" x2="${w - padR}" y1="${ly.toFixed(1)}" y2="${ly.toFixed(1)}" stroke="#1F2D3A" stroke-dasharray="3 3" stroke-width=".8"/>` +
    `<rect x="${w - padR + 2}" y="${(ly - 9).toFixed(1)}" width="${padR - 4}" height="18" rx="3" fill="#1F2D3A"/><text x="${w - padR + 6}" y="${(ly + 4).toFixed(1)}" font-size="11" fill="#fff" font-weight="700">${fmtPrice(id, last.c)}</text>`;
  return `<svg class="kline" viewBox="0 0 ${w} ${h}" role="img" aria-label="${assetName(id)} K 線圖">${g}</svg>`;
}
IO.chart = (id, opts) => klineSVG(id, opts);

IO.yearReport = (p, ev) => {

  const comp = m.comp.length ? `<h3 class="subhead">今年的公司消息</h3><ul class="list">${m.comp.map(c => `<li>${c.month + 1} 月　${STOCK_MAP[c.stock].name}：${c.text} <b class="${c.eff > 0 ? 'up' : 'down'}">${c.eff > 0 ? '▲' : '▼'}</b>${p.stocks[c.stock] > 0 ? '　<small style="display:inline">你有持股</small>' : ''}</li>`).join('')}</ul>` : '';
  const notes = yi.notes.map(n => `<div class="note"><b>${n.t}</b><div>${n.b}</div></div>`).join('');
  const body = `<p class="evmeta">${m.plan.shape === 'gradual' ? `從 ${m.plan.em + 1} 月開始逐漸發酵` : `${m.plan.em + 1} 月爆發`}</p>
    ${klineSVG('IDX', { mode: 'month', range: 24, h: 200 })}
    <div class="ticker num">
      <span>加權指數 <b class="${sign(r.IDX)}">${pct(r.IDX)}</b></span><span>央行利率 <b>${(m.rate * 100).toFixed(2)}%</b></span>
      <span>美元 <b class="${sign(r.USD)}">${pct(r.USD)}</b></span><span>黃金 <b class="${sign(r.GOLD)}">${pct(r.GOLD)}</b></span><span>房價 <b class="${sign(m.propRet)}">${pct(m.propRet)}</b></span><span>物價 <b class="up">${pct(m.inflRate)}</b></span>
    </div>
    ${impactHTML(p, false)}
    ${yi.recap ? `<div class="note recap">${yi.recap}</div>` : ''}
    ${notes}${comp}
    ${G.settings.tips ? `<div class="lesson">${ev.lesson}</div>` : ''}`;
  return openChoice({ title: `${yearLabel(G.round)} 年：${ev.name}`, body, options: [{ label: '繼續', value: true }], wide: true });
};

// ================= 投資理財視窗 =================
const T = { tab: 'stock', msg: '', ok: true, resolve: null, chart: { stock: 'IDX', futures: 'IDX', fx: 'USD' }, cmode: 'month', crange: 36 };
const TABS = [['stock', '股票'], ['bond', '債券'], ['futures', '期貨'], ['fx', '外匯'], ['assets', '房產與事業'], ['loans', '借貸']];

function canTrade() { const { p, ph } = UI.phase; return !!p && p.isHuman && ['roll', 'tile', 'free'].includes(ph); }
function openTrade(tab) {
  if (tab) T.tab = tab; T.msg = '';
  $('#trade').hidden = false; renderTrade();
  const first = $('#trade [data-tt]'); if (first) first.focus();
  return new Promise(r => { T.resolve = r; });
}
function closeTrade() {
  $('#trade').hidden = true; $('#trade').innerHTML = '';
  const r = T.resolve; T.resolve = null; if (r) r();
  renderAll();
}
function chartPanel(ids) {
  const sel = ids.includes(T.chart[T.tab]) ? T.chart[T.tab] : ids[0], m = G.market, r = m.ret[sel];
  const short = id => (id === 'IDX' ? '大盤' : STOCK_MAP[id] ? STOCK_MAP[id].name.replace(' ETF', '') : assetName(id).replace('兌台幣', ''));
  const news = m.marks.filter(k => k.ids.includes(sel) && k.y >= G.round - 2).slice().reverse().slice(0, 6);
  return `<div class="chartbox">
    <div class="chartbar">
      <div class="seg small">${ids.map(id => `<button data-chart="${id}" aria-pressed="${id === sel}">${short(id)}</button>`).join('')}</div>
      <div class="seg small">${[['month', '月 K'], ['year', '年 K']].map(([v, l]) => `<button data-cmode="${v}" aria-pressed="${T.cmode === v}">${l}</button>`).join('')}</div>
      ${T.cmode === 'month' ? `<div class="seg small">${[[36, '近 3 年'], [120, '近 10 年'], [0, '全部']].map(([v, l]) => `<button data-crange="${v}" aria-pressed="${T.crange === v}">${l}</button>`).join('')}</div>` : ''}
    </div>
    <div class="chartsum">${assetName(sel)}　<b class="num">${fmtPrice(sel, assetPrice(sel))}</b>　今年 <b class="num ${r == null ? '' : sign(r)}">${r == null ? '—' : pct(r)}</b></div>
    ${klineSVG(sel, { mode: T.cmode, range: T.crange })}
    <div class="legend"><span><i class="lg-up"></i>紅 K：收盤比開盤高</span><span><i class="lg-down"></i>綠 K：收盤比開盤低</span><span><i class="lg-ma"></i>${T.cmode === 'year' ? '5 年' : '12 個月'}均線</span><span>▼ 事件標記（黑色是大事件，紅綠是公司消息），游標移到 K 棒上可看詳細價格</span></div>
    ${news.length ? `<ul class="newslist">${news.map(k => `<li><span class="num">${yearLabel(k.y)} 年 ${k.mo + 1} 月</span>${k.text}${k.macro ? '' : ` <b class="${k.up ? 'up' : 'down'}">${k.up ? '▲' : '▼'}</b>`}</li>`).join('')}</ul>` : ''}
  </div>`;
}
const kv = (lbl, val, cls = '') => `<div class="kv"><span class="lbl">${lbl}</span><span class="num ${cls}">${val}</span></div>`;
const btn = (act, label, cls, data = {}, dis = false) => `<button class="btn sm ${cls}" data-act="${act}" ${Object.entries(data).map(([k, v]) => `data-${k}="${v}"`).join(' ')} ${dis || !canTrade() ? 'disabled' : ''}>${label}</button>`;
const inp = (id, ph) => `<input type="number" id="${id}" min="0" step="any" placeholder="${ph}" ${canTrade() ? '' : 'disabled'}>`;

function renderTrade() {
  const me = human(), m = G.market, tips = G.settings.tips;
  let c = '';
  if (T.tab === 'stock') {
    c += tips ? `<div class="tip">股票代表公司的一小部分所有權，可以賺股價價差，也能領股利（股利才算被動收入）。買賣手續費 0.1425%${me.feeFree ? '（本回合免收）' : ''}，賣出另收證交稅 0.3%。台股是<b class="up">紅漲</b><b class="down">綠跌</b>。1 張＝1,000 股，也可以買零股。</div>` : '';
    c += chartPanel(['IDX', ...STOCKS.map(s => s.id)]);
    c += STOCKS.map(s => {
      const q = me.stocks[s.id], price = m.prices[s.id], val = q * price, r = m.ret[s.id];
      const gain = q ? val - me.cost[s.id] : 0;
      return `<div class="asset"><div class="nm"><b>${s.name}</b><small>${s.desc}</small></div>
        ${kv('股價', price.toLocaleString(undefined, { maximumFractionDigits: 2 }))}${kv('今年漲跌', r == null ? '—' : pct(r), r == null ? '' : sign(r))}${kv('殖利率', (s.div * 100).toFixed(1) + '%')}
        ${kv('持有', q.toLocaleString() + ' 股')}${kv('市值／損益', q ? `${money(val)}<br><span class="${sign(gain)}">${money(gain)}</span>` : '—')}
        <div class="act"><button class="btn sm" data-chart="${s.id}" data-top="1">看走勢</button>${inp('q-' + s.id, '股數')}${btn('maxStock', '可買上限', '', { id: s.id })}${btn('buyStock', '買進', 'buy', { id: s.id })}${btn('sellStock', '賣出', 'sell', { id: s.id })}${q ? btn('sellAllStock', '全部賣出', 'sell', { id: s.id }) : ''}</div></div>`;
    }).join('');
  }
  if (T.tab === 'bond') {
    const d = 10 * 0.85 * 0.01;
    c += tips ? `<div class="tip">買債券就是借錢給政府或公司，每年領固定利息，到期拿回本金（每單位面額 1 萬）。<b>利率上升時舊債券價格會下跌</b>，例如利率升 1%，剛買的 10 年期公債市價約跌 ${(d * 100).toFixed(1)}%。持有到期就不怕價格波動，但利息越高的債券違約風險越高。</div>` : '';
    c += `<h3 class="subhead">發行中的債券</h3>` + Object.entries(BOND_TYPES).map(([k, b]) => {
      const bonus = me.bondBonus && k === 'GOV' ? 0.003 : 0;
      return `<div class="asset"><div class="nm"><b>${b.name}</b><small>${b.desc}</small></div>
        ${kv('票面利率', ((bondYield(k) + bonus) * 100).toFixed(2) + '%' + (bonus ? '（標售加碼）' : ''))}${kv('年期', b.years + ' 年')}${kv('違約風險', b.risk)}
        <div class="act">${inp('b-' + k, '單位數')}${btn('maxBond', '可買上限', '', { id: k })}${btn('buyBond', '買進', 'buy', { id: k })}</div></div>`;
    }).join('');
    c += `<h3 class="subhead">我的債券</h3>` + (me.bonds.length ? me.bonds.map((l, i) => {
      const unit = bondUnitPrice(l), diff = unit / BOND_FACE - 1;
      return `<div class="asset"><div class="nm"><b>${BOND_TYPES[l.type].name}</b><small>面額 ${money(l.units * BOND_FACE)}</small></div>
        ${kv('票面利率', (l.coupon * 100).toFixed(2) + '%')}${kv('每年利息', money(l.units * BOND_FACE * l.coupon))}${kv('剩餘年期', l.yearsLeft + ' 年')}${kv('目前市價', `${money(unit * l.units)}<br><span class="${sign(diff)}">${pct(diff)}</span>`)}
        <div class="act">${btn('sellBond', '提前賣出', 'sell', { i })}</div></div>`;
    }).join('') : '<div class="empty">還沒有持有債券。</div>');
  }
  if (T.tab === 'futures') {
    c += tips ? `<div class="tip">期貨只要付合約價值 10% 的保證金，等於<b>十倍槓桿</b>。價格變動 10%，損益就等於全部保證金。每年大事件後結算一次損益：保證金跌破七成五會被追繳，現金不夠補就會被強制平倉。期貨損益不算被動收入。</div>` : '';
    c += chartPanel(['IDX', 'GOLD']);
    c += Object.entries(FUTURES).map(([k, f]) => {
      const price = futPrice(k), cv = price * f.mult, mg = futMarginPer(k), r = m.ret[k === 'IDX' ? 'IDX' : 'GOLD'];
      return `<div class="asset"><div class="nm"><b>${f.name}</b><small>${f.desc}</small></div>
        ${kv('現價', price.toLocaleString())}${kv('今年漲跌', r == null ? '—' : pct(r), r == null ? '' : sign(r))}${kv('每口合約價值', money(cv))}${kv('每口保證金', money(mg))}
        ${kv('價格變動 10% 時', `每口 ±${money(cv * 0.1)}`)}
        <div class="act">${inp('f-' + k, '口數')}${btn('openFut', '做多（看漲）', 'buy', { id: k, dir: 1 })}${btn('openFut', '做空（看跌）', 'sell', { id: k, dir: -1 })}</div></div>`;
    }).join('');
    c += `<h3 class="subhead">我的期貨部位</h3>` + (me.futures.length ? me.futures.map((f, i) => {
      const init = futMarginPer(f.type) * f.qty, lvl = f.margin / init;
      return `<div class="asset"><div class="nm"><b>${FUTURES[f.type].name}</b><small>${f.dir > 0 ? '做多' : '做空'} ${f.qty} 口</small></div>
        ${kv('結算價', f.entry.toLocaleString())}${kv('保證金餘額', money(f.margin))}${kv('保證金水位', Math.round(lvl * 100) + '%', lvl < 0.9 ? 'up' : '')}${kv('上次結算損益', f.lastPnl == null ? '尚未結算' : money(f.lastPnl), f.lastPnl == null ? '' : sign(f.lastPnl))}
        <div class="act">${btn('closeFut', '平倉', 'sell', { i })}</div></div>`;
    }).join('') : '<div class="empty">目前沒有期貨部位。</div>');
  }
  if (T.tab === 'fx') {
    c += tips ? `<div class="tip">把台幣換成外幣存款，可以賺<b>利差</b>（外幣利息）和<b>匯差</b>（外幣升值）。銀行買賣價的差距就是換匯成本${me.fxDiscount ? '，本回合匯差減半' : ''}。美元兌台幣從 32 變 33，代表美元升值、台幣貶值。</div>` : '';
    c += chartPanel(['USD', 'JPY', 'EUR']);
    c += Object.entries(CURRENCIES).map(([k, cu]) => {
      const amt = me.fx[k], twd = amt * m.fx[k], r = m.ret[k], gain = amt > 0.5 ? amt * fxSellRate(k, me) - me.fxCost[k] : 0;
      const fmt = k === 'JPY' ? 4 : 3;
      return `<div class="asset"><div class="nm"><b>${cu.name}</b><small>外幣存款年利率 ${(cu.interest * 100).toFixed(1)}%</small></div>
        ${kv('你換入的價格', fxBuyRate(k, me).toFixed(fmt))}${kv('你換回的價格', fxSellRate(k, me).toFixed(fmt))}${kv('今年升貶', r == null ? '—' : pct(r), r == null ? '' : sign(r))}
        ${kv('持有', amt > 0.5 ? Math.round(amt).toLocaleString() : '—')}${kv('折合台幣／損益', amt > 0.5 ? `${money(twd)}<br><span class="${sign(gain)}">${money(gain)}</span>` : '—')}
        <div class="act">${inp('x-' + k, '台幣金額')}${btn('buyFx', '換成' + cu.name, 'buy', { id: k })}${inp('y-' + k, cu.name + '金額')}${btn('sellFx', '換回台幣', 'sell', { id: k })}${amt > 0.5 ? btn('sellAllFx', '全部換回', 'sell', { id: k }) : ''}</div></div>`;
    }).join('');
  }
  if (T.tab === 'assets') {
    c += tips ? `<div class="tip">房產要停在房產格才能買，事業要到創業中心開設。需要現金時，可以在這裡隨時出售。房子賣出要付 3% 交易成本，事業頂讓價依規模和去年利潤估算。</div>` : '';
    c += `<h3 class="subhead">不動產</h3>` + (me.props.length ? me.props.map((x, i) => {
      const g = x.value / x.cost - 1;
      return `<div class="asset"><div class="nm"><b>${TILES[x.tile].name}</b><small>${x.level ? '裝修等級 ' + '★'.repeat(x.level) : '未裝修'}</small></div>
        ${kv('市價', `${money(x.value)}<br><span class="${sign(g)}">${pct(g)}</span>`)}${kv('房貸餘額', money(x.loan))}${kv('每年租金', money(propRent(x)))}${kv('每年房貸本息', x.loan ? money(amort(x.loan, mortRate(), x.years)) : '—')}
        <div class="act">${btn('sellProp', `出售（拿回 ${money(x.value * 0.97 - x.loan)}）`, 'sell', { i })}</div></div>`;
    }).join('') : '<div class="empty">還沒有房產。停在房產格時可以買下收租。</div>');
    c += `<h3 class="subhead">事業</h3>` + (me.biz.length ? me.biz.map((b, i) => {
      const rev = bizRevenue(me, b);
      return `<div class="asset"><div class="nm"><b>${bizName(b)}</b><small>${bizSummary(me, b)}</small></div>
        ${kv('店數', b.shops.length + ' 家')}${kv('預估年營收', money(rev))}${kv('去年利潤', b.lastProfit == null ? '尚未結算' : money(b.lastProfit), b.lastProfit == null ? '' : sign(b.lastProfit))}${kv('預估今年利潤', money(bizExpected(me, b)), sign(bizExpected(me, b)))}
        <div class="act">${btn('manageBiz', '經營管理', '', { i })}${btn('sellBiz', `頂讓（拿回 ${money(bizValue(b))}）`, 'sell', { i })}</div></div>`;
    }).join('') : '<div class="empty">還沒有事業。</div>');
    c += `<div class="act" style="margin-top:6px">${btn('openBiz', '開始一個新事業', 'buy')}<small>停在「創業中心」格開業，成本可以打 85 折</small></div>`;
    c += `<h3 class="subhead">保險</h3><div class="empty">${me.insured ? `已投保醫療險，每年保費 ${money(premium(me))}，醫療費理賠八成。` : '尚未投保醫療險，可以到「保險公司」格投保。'}</div>`;
  }
  if (T.tab === 'loans') {
    c += tips ? `<div class="tip">負債的利率差很多：學貸 1.5%、房貸約 ${(mortRate() * 100).toFixed(2)}%、信用貸款 8%。有閒錢時先還利率最高的債，等於穩賺那個利率。</div>` : '';
    c += `<div class="asset"><div class="nm"><b>信用貸款</b><small>年利率 8%，每年至少還兩成</small></div>${kv('餘額', money(me.credit))}
      <div class="act">${inp('r-credit', '還款金額')}${btn('repay', '還款', '', { id: 'credit' }, !me.credit)}${btn('repayAll', '全部還清', '', { id: 'credit' }, !me.credit)}</div></div>`;
    c += `<div class="asset"><div class="nm"><b>就學貸款</b><small>年利率 1.5%，畢業後分 8 年償還</small></div>${kv('餘額', money(me.studentLoan))}
      <div class="act">${inp('r-student', '還款金額')}${btn('repay', '還款', '', { id: 'student' }, !me.studentLoan)}${btn('repayAll', '全部還清', '', { id: 'student' }, !me.studentLoan)}</div></div>`;
    const mort = me.props.filter(x => x.loan > 0);
    c += `<div class="asset"><div class="nm"><b>房貸</b><small>利率隨央行利率變動</small></div>${kv('餘額', money(mort.reduce((s, x) => s + x.loan, 0)))}${kv('每年本息', money(mortgagePay(me)))}</div>`;
  }
  const h = holdings(me);
  const old = $('#trade .modal'), sc = old ? old.scrollTop : 0;
  $('#trade').innerHTML = `<div class="modal wide" role="dialog" aria-modal="true" aria-labelledby="tTitle">
    <div class="trade-head"><h2 id="tTitle">投資理財</h2><span class="cash">現金 <b class="num">${money(me.cash)}</b>　淨資產 <b class="num">${money(h.net)}</b></span><button class="btn sm" id="tradeClose">完成</button></div>
    ${canTrade() ? '' : '<div class="readonly">現在不是你的回合，只能查看行情。</div>'}
    <div class="ttabs" role="tablist">${TABS.map(([k, l]) => `<button role="tab" data-tt="${k}" aria-selected="${T.tab === k}">${l}</button>`).join('')}</div>
    <div class="tmsg ${T.ok ? 'ok' : 'err'}" role="status">${T.msg}</div>${c}</div>`;
  $('#trade .modal').scrollTop = sc;
}

function tradeClick(e) {
  if (e.target.id === 'trade') return;
  if (e.target.id === 'tradeClose') return closeTrade();
  const tt = e.target.closest('[data-tt]'); if (tt) { T.tab = tt.dataset.tt; T.msg = ''; renderTrade(); $('#trade .modal').scrollTop = 0; return; }
  const ch = e.target.closest('[data-chart],[data-cmode],[data-crange]');
  if (ch) {
    if (ch.dataset.chart) T.chart[T.tab] = ch.dataset.chart;
    if (ch.dataset.cmode) T.cmode = ch.dataset.cmode;
    if (ch.dataset.crange) T.crange = +ch.dataset.crange;
    renderTrade(); if (ch.dataset.top) $('#trade .modal').scrollTop = 0; return;
  }
  const b = e.target.closest('[data-act]'); if (!b || b.disabled || !canTrade()) return;
  const me = human(), d = b.dataset, val = id => parseFloat(($('#' + id) || {}).value);
  let res = null;
  switch (d.act) {
    case 'maxStock': { const price = G.market.prices[d.id]; $('#q-' + d.id).value = Math.max(0, Math.floor(me.cash / (price * (me.feeFree ? 1 : 1.001425)))); return; }
    case 'maxBond': $('#b-' + d.id).value = Math.max(0, Math.floor(me.cash / BOND_FACE)); return;
    case 'buyStock': res = buyStock(me, d.id, val('q-' + d.id)); break;
    case 'sellStock': res = sellStock(me, d.id, val('q-' + d.id)); break;
    case 'sellAllStock': res = sellStock(me, d.id, me.stocks[d.id]); break;
    case 'buyBond': res = buyBond(me, d.id, val('b-' + d.id)); break;
    case 'sellBond': res = sellBond(me, +d.i); break;
    case 'openFut': res = openFut(me, d.id, +d.dir, val('f-' + d.id)); break;
    case 'closeFut': res = closeFut(me, +d.i); break;
    case 'buyFx': res = buyFx(me, d.id, val('x-' + d.id)); break;
    case 'sellFx': res = sellFx(me, d.id, val('y-' + d.id)); break;
    case 'sellAllFx': res = sellFx(me, d.id, me.fx[d.id]); break;
    case 'sellProp': res = sellProp(me, +d.i); break;
    case 'sellBiz': res = sellBiz(me, +d.i); break;
    case 'buyItem': res = buyItem(me, d.id); break;
    case 'sellItem': res = sellItem(me, +d.i); break;
    case 'dateLevel': me.dateLevel = +d.i; res = { ok: true, msg: `感情經營改為「${DATE_LEVELS[me.dateLevel].name}」，每年 ${money(dateCost(me))}` }; break;
    case 'wellness': {
      me.wellness[d.id] = !me.wellness[d.id];
      res = { ok: true, msg: me.wellness[d.id] ? `已加入${WELLNESS[d.id].name}，每年 ${money(WELLNESS[d.id].cost * WAN * G.market.infl)}` : `已取消${WELLNESS[d.id].name}` };
      break;
    }
    case 'openBiz': openBusinessFlow(me).then(() => { T.msg = ''; renderAll(); }); return;
    case 'manageBiz': manageOneBusiness(me, +d.i).then(() => { T.msg = ''; renderAll(); }); return;
    case 'repay': res = repay(me, d.id, val('r-' + d.id)); break;
    case 'repayAll': res = repay(me, d.id, d.id === 'credit' ? me.credit : me.studentLoan); break;
  }
  if (res) { T.msg = res.msg; T.ok = res.ok; renderAll(); }
}

// ================= 生活視窗：感情、門面、健康 =================
const L = { tab: 'love', msg: '', ok: true, resolve: null };
const LIFE_TABS = [['love', '感情'], ['career', '職涯'], ['look', '門面'], ['health', '健康']];

function openLife(tab) {
  if (tab) L.tab = tab;
  L.msg = '';
  $('#life').hidden = false; renderLife();
  return new Promise(r => { L.resolve = r; });
}
function closeLife() {
  $('#life').hidden = true; $('#life').innerHTML = '';
  const r = L.resolve; L.resolve = null; if (r) r();
  renderAll();
}
const lbtn = (act, label, cls, data = {}, dis = false) =>
  `<button class="btn sm ${cls || ''}" data-lact="${act}" ${Object.entries(data).map(([k, v]) => `data-${k}="${v}"`).join(' ')} ${dis || !canTrade() ? 'disabled' : ''}>${label}</button>`;

function renderLife() {
  const me = human(), tips = G.settings.tips, infl = G.market.infl;
  let c = '';
  if (L.tab === 'love') {
    c += tips ? `<div class="tip">關係值每半年會自然下滑，靠約會和陪伴才能維持。加班、經營事業、背卡債都會扣分。關係跌到谷底會分手，已婚則可能離婚，財產要分割三成以上。</div>` : '';
    if (me.partner) {
      const pt = me.partner;
      c += `<div class="pcard"><div class="pname">${esc(pt.name)}　<span>${GENDERS[pt.gender]}　${pt.jobName}　${me.married ? '配偶' : STAGES[pt.stage].name}</span></div>
        <div class="relbar"><i style="width:${pt.rel}%"></i></div>
        <div class="prow"><b>好感度</b>${Math.round(pt.rel)} / ${STAGES[pt.stage].cap}　${relLabel(pt.rel)}${pt.living ? '　同居中' : ''}</div>
        <div class="prow"><b>在一起</b>${pt.years} 年</div>
        <div class="prow"><b>收入</b>${pt.homemaker ? '全職照顧家庭（無收入）' : money(pt.income)}</div>
        <div class="prow"><b>金錢觀</b>${VALUES[pt.values].name}<small>${VALUES[pt.values].desc}</small></div>
        <div class="prow"><b>個性</b>${TRAITS[pt.trait].name}<small>${TRAITS[pt.trait].desc}</small></div>
        <div class="prow"><b>缺點</b>${FLAWS[pt.flaw].name}<small>${FLAWS[pt.flaw].desc}</small></div>
        <div class="prow"><b>興趣</b>${pt.hobby}</div>
        <div class="prow"><b>家庭</b>${BACKGROUNDS[pt.bg].name}</div>
        <div class="prow"><b>對小孩</b>${pt.wantKids ? `希望生 ${pt.wantKids} 個，已有 ${me.kidsBorn || 0} 個` : '沒有生小孩的打算'}</div></div>`;
      const st = STAGES[pt.stage];
      c += `<div class="asset"><div class="nm"><b>目前階段：${st.name}</b><small>${st.desc}</small></div>
        ${kv('好感度上限', st.cap)}${kv('日常開銷', money(dateCost(me)) + ' / 年')}
        ${st.next != null ? kv('下一階段', pt.pending ? `已達門檻，再走 ${Math.max(0, st.steps - pt.steps)} 步觸發` : `好感度要到 ${st.next}`) : kv('下一步', '可以求婚了')}</div>`;
      const usedN = (me.dateActs || []).length;
      c += `<h3 class="subhead">安排行程　<small>這半年還可以安排 ${DATE_SLOTS - usedN} 項（每項各限一次）</small></h3>`;
      c += DATES.map(d => {
        const cost = dateReal(me, d), locked = d.stage > pt.stage;
        const done = (me.dateActs || []).includes(d.id), full = usedN >= DATE_SLOTS;
        const hob = d.hobby ? `　對方喜歡${pt.hobby}，額外 +4` : '';
        return `<div class="asset"><div class="nm"><b>${d.name}</b><small>${locked ? `要到「${STAGES[d.stage].name}」才能選` : d.desc + hob}</small></div>
          ${kv('花費', cost ? money(cost) : '免費')}${kv('好感度', '+' + (d.rel + (d.hobby ? 4 : 0)))}
          <div class="act">${lbtn('date', done ? '已安排' : '安排', 'buy', { id: d.id }, locked || done || full || me.cash < cost)}</div></div>`;
      }).join('');
    } else {
      c += `<div class="empty">目前單身${me.coolDownLove > 0 ? '，最近還沒走出上一段感情' : ''}。門面、人脈和生活方式會影響你遇到對象的機會。</div>`;
    }
    c += `<h3 class="subhead">孩子</h3>` + (me.kids.length ? me.kids.map(k => `<div class="asset"><div class="nm"><b>${k.age} 歲的孩子</b><small>${k.age >= 6 ? EDU_PLANS[k.plan].name : '學齡前'}</small></div>
      ${kv('每年花費', money((k.age >= 6 ? EDU_PLANS[k.plan].cost : 16) * WAN * infl))}${kv('教育規劃', k.age >= 6 ? EDU_PLANS[k.plan].name : '上小學時再決定')}</div>`).join('')
      : `<div class="empty">${(me.kidsBorn || 0) ? '孩子都已經長大獨立了。' : '目前沒有小孩。'}</div>`);
    if (me.alimony) c += `<div class="asset"><div class="nm"><b>子女扶養費</b><small>離婚後仍須負擔</small></div>${kv('每年', money(me.alimony))}</div>`;
  }
  if (L.tab === 'career') {
    const j = me.job ? JOBS.find(x => x.id === me.job) : null;
    const cf = cashflow(me), freeOK = cf.totP >= cf.rec;
    c += tips ? `<div class="tip">被動收入夠支付生活開銷時，就可以考慮離開職場。退休後沒有薪水，但工作不再消耗健康，也有更多時間陪伴家人和經營事業。自己當老闆時，你本人就等於一個人力，可以少請一位員工。</div>` : '';
    c += `<div class="asset"><div class="nm"><b>${statusLabel(me)}</b><small>${me.retired ? '你已經離開職場' : j ? `工作壓力 ${'●'.repeat(Math.ceil(j.stress / 4))}` : '目前沒有工作'}</small></div>
      ${kv('年薪', me.salary ? money(me.salary) : '—')}${kv('工作年資', me.workYears + ' 年')}${kv('健康消耗', `-${healthDrain(me).toFixed(1)} / 年`)}
      ${kv('被動收入', money(cf.totP), freeOK ? '' : 'up')}${kv('經常性支出', money(cf.rec))}</div>`;
    if (!me.retired) {
      c += `<div class="asset"><div class="nm"><b>離開職場</b><small>${freeOK ? '你的被動收入已經蓋得過生活開銷，可以安心退休' : '被動收入還不夠支付生活開銷，退休後會開始吃老本'}</small></div>
        <div class="act">${me.status === 'employed' ? lbtn('quit', '辭職（之後還能再找工作）', '', {}) : ''}${lbtn('retire', '正式退休', freeOK ? 'buy' : 'sell', {})}</div></div>`;
    } else {
      c += `<div class="asset"><div class="nm"><b>重返職場</b><small>想再工作隨時可以</small></div>
        <div class="act">${lbtn('unretire', '結束退休狀態', '', {})}</div></div>`;
    }
    if (me.biz.length) c += `<h3 class="subhead">我的事業</h3>` + me.biz.map(b => `<div class="asset"><div class="nm"><b>${bizName(b)}</b><small>${bizSummary(me, b)}</small></div>
      ${kv('去年利潤', b.lastProfit == null ? '尚未結算' : money(b.lastProfit))}${kv('每半年入帳', b.lastProfit == null ? '—' : money(b.lastProfit / 2))}${kv('你在店裡嗎', ownerWorks(me, b) ? '是，等於一個人力' : b.manager ? '否，已請店長' : '否，你還在上班')}</div>`).join('');
  }
  if (L.tab === 'look') {
    const app = appearance(me), cap = netCap(me);
    c += tips ? `<div class="tip">有些場合看的是門面：面試高階職位、經營高端客層、打入更好的圈子都需要。但這些是<b>消費品不是資產</b>，車子每年折舊、名牌轉手有價差，還要付保養保險，都會墊高你的經常性支出。效果也遞減：從沒有到得體進步最大，往上堆效果很小。</div>` : '';
    c += `<div class="asset"><div class="nm"><b>目前的門面</b><small>你認識的人有 ${me.net}，但門面撐得起來的只有 ${cap}</small></div>
      ${kv('門面分數', app)}${kv('有效人脈', netEff(me), me.net > cap ? 'up' : '')}${kv('每年維護費', money(itemsUpkeep(me)))}</div>`;
    c += `<h3 class="subhead">我擁有的車輛與精品</h3>` + (me.items.length ? me.items.map((it, i) => {
      const I = ITEM[it.id], g = it.value / (I.cost * WAN) - 1;
      return `<div class="asset"><div class="nm"><b>${I.name}</b><small>${I.lux ? '精品：價值跟著市場行情走' : `消費品：每年折舊 ${(I.depr * 100).toFixed(0)}%`}</small></div>
        ${kv('目前價值', `${money(it.value)}<br><span class="${sign(g)}">${pct(g)}</span>`)}${kv('門面分', I.lux ? I.app : `${Math.round(I.app * condition(it))} / ${I.app}`)}${kv('狀態', condLabel(it))}${kv('年維護費', I.upkeep ? money(I.upkeep * WAN * infl) : '無')}
        <div class="act">${lbtn('sellItem', `賣出（拿回 ${money(it.value * RESALE[I.cat])}）`, 'sell', { i })}</div></div>`;
    }).join('') : '<div class="empty">目前什麼都沒有。一套基本正裝只要幾萬元，卻是最划算的門面投資。</div>');
    c += `<h3 class="subhead">可以買的項目</h3>` + ITEMS.filter(I => !me.items.some(x => x.id === I.id)).map(I => {
      const cost = I.cost * WAN * infl;
      return `<div class="asset"><div class="nm"><b>${I.name}</b><small>${I.desc}</small></div>
        ${kv('價格', money(cost))}${kv('門面分', I.app)}${kv('年維護費', I.upkeep ? money(I.upkeep * WAN * infl) : '無')}${kv(I.lux ? '價值變化' : '年折舊', I.lux ? '跟著行情' : `-${(I.depr * 100).toFixed(0)}%`)}
        <div class="act">${lbtn('buyItem', '買進', 'buy', { id: I.id }, me.cash < cost)}</div></div>`;
    }).join('');
  }
  if (L.tab === 'health') {
    c += tips ? `<div class="tip">健康會被工作消耗，壓力大、薪水高、年紀大的消耗都更快。健康太低容易生病，一場大病可能吃掉好幾年的存款。這些方案是每年的固定支出。</div>` : '';
    c += `<div class="asset"><div class="nm"><b>目前狀態</b><small>${me.health >= 70 ? '狀況不錯' : me.health >= 45 ? '有點疲勞，該注意了' : '很差，生病機率很高'}</small></div>
      ${kv('健康值', Math.round(me.health), me.health < 45 ? 'up' : '')}${kv('每年工作消耗', `-${healthDrain(me).toFixed(1)}`)}${kv('方案加成', `+${wellnessGain(me)}`)}${kv('方案年費', money(wellnessCost(me)))}</div>`;
    c += Object.entries(WELLNESS).map(([k, w]) => `<div class="asset"><div class="nm"><b>${w.name}</b><small>${w.desc}</small></div>
      ${kv('年費', money(w.cost * WAN * infl))}${kv('狀態', me.wellness[k] ? '已加入' : '未加入')}
      <div class="act">${lbtn('wellness', me.wellness[k] ? '取消' : '加入', me.wellness[k] ? 'sell' : 'buy', { id: k })}</div></div>`).join('');
    c += `<div class="asset"><div class="nm"><b>醫療險</b><small>轉移大筆醫療支出的風險</small></div>
      ${kv('狀態', me.insured ? '已投保' : '未投保')}${kv('年保費', me.insured ? money(premium(me)) : '—')}
      <div class="act"><small>可以在棋盤的「保險公司」格投保或解約</small></div></div>`;
  }
  const old = $('#life .modal'), sc = old ? old.scrollTop : 0;
  $('#life').innerHTML = `<div class="modal wide" role="dialog" aria-modal="true" aria-labelledby="lTitle">
    <div class="trade-head"><h2 id="lTitle">生活</h2><span class="cash">現金 <b class="num">${money(me.cash)}</b>　生活品質 <b class="num">${qualityOfLife(me)}</b></span><button class="btn sm" id="lifeClose">完成</button></div>
    ${canTrade() ? '' : '<div class="readonly">現在不是你的回合，只能查看。</div>'}
    <div class="ttabs" role="tablist">${LIFE_TABS.map(([k, lb]) => `<button role="tab" data-ltt="${k}" aria-selected="${L.tab === k}">${lb}</button>`).join('')}</div>
    <div class="tmsg ${L.ok ? 'ok' : 'err'}" role="status">${L.msg}</div>${c}</div>`;
  $('#life .modal').scrollTop = sc;
}

function lifeClick(e) {
  if (e.target.id === 'life') return;
  if (e.target.id === 'lifeClose') return closeLife();
  const tt = e.target.closest('[data-ltt]');
  if (tt) { L.tab = tt.dataset.ltt; L.msg = ''; renderLife(); $('#life .modal').scrollTop = 0; return; }
  const b = e.target.closest('[data-lact]'); if (!b || b.disabled || !canTrade()) return;
  const me = human(), d = b.dataset;
  let res = null;
  switch (d.lact) {
    case 'quit': quitJob(me, false).then(() => { L.msg = ''; renderAll(); }); return;
    case 'retire': quitJob(me, true).then(() => { L.msg = ''; renderAll(); }); return;
    case 'unretire': me.retired = false; ensurePlan(me); res = { ok: true, msg: '你決定重返職場，之後會再收到工作機會' }; break;
    case 'buyItem': res = buyItem(me, d.id); break;
    case 'sellItem': res = sellItem(me, +d.i); break;
    case 'date': res = doDate(me, d.id); break;
    case 'wellness':
      me.wellness[d.id] = !me.wellness[d.id];
      res = { ok: true, msg: me.wellness[d.id] ? `已加入${WELLNESS[d.id].name}，每年 ${money(WELLNESS[d.id].cost * WAN * G.market.infl)}` : `已取消${WELLNESS[d.id].name}` };
      break;
  }
  if (res) { L.msg = res.msg; L.ok = res.ok; renderAll(); }
}

// ================= 夢想與成就視窗 =================
const DW = { msg: '', ok: true, resolve: null };
function openDream() { DW.msg = ''; $('#dream').hidden = false; renderDream(); return new Promise(r => { DW.resolve = r; }); }
function closeDream() {
  $('#dream').hidden = true; $('#dream').innerHTML = '';
  const r = DW.resolve; DW.resolve = null; if (r) r();
  renderAll();
}
const dbtn = (act, label, cls, data = {}, dis = false) =>
  `<button class="btn sm ${cls || ''}" data-dact="${act}" ${Object.entries(data).map(([k, v]) => `data-${k}="${v}"`).join(' ')} ${dis || !canTrade() ? 'disabled' : ''}>${label}</button>`;

function renderDream() {
  const me = human(), tips = G.settings.tips, infl = G.market.infl;
  let c = '';
    c += tips ? `<div class="tip">賺到錢之後要做什麼？這些是花錢買體驗和名聲的地方。多數會貶值或要養，但會留下人生成就，也會計入結局評比。</div>` : '';
    c += `<div class="asset"><div class="nm"><b>目前狀態</b><small>已完成 ${achievedCount(me)} / ${ACHIEVEMENTS.length} 項成就</small></div>
      ${kv('夢想清單', (me.dreams || []).length + ' 項')}${kv('聲望', prestige(me))}${kv('每年維護', money(dreamsUpkeep(me)))}${kv('生活品質', qualityOfLife(me))}</div>`;
    c += `<h3 class="subhead">我實現的夢想</h3>` + ((me.dreams || []).length ? me.dreams.map((it, i) => {
      const D = DREAM[it.id], g = it.value / (D.cost * WAN) - 1;
      return `<div class="asset"><div class="nm"><b>${D.name}</b><small>${D.desc}</small></div>
        ${kv('目前價值', `${money(it.value)}<br><span class="${sign(g)}">${pct(g)}</span>`)}${kv('聲望', D.prestige)}${kv('年維護', money(D.upkeep * WAN * infl))}
        <div class="act">${D.keep ? '<small>這項無法變賣</small>' : dbtn('sellDream', `賣出（拿回 ${money(it.value * 0.88)}）`, 'sell', { i })}</div></div>`;
    }).join('') : '<div class="empty">還沒有。這些都很貴，先把資產累積起來吧。</div>');
    c += `<h3 class="subhead">夢想清單</h3>` + DREAMS.filter(D => !(me.dreams || []).some(x => x.id === D.id)).map(D => {
      const cost = D.cost * WAN * infl;
      return `<div class="asset"><div class="nm"><b>${D.name}</b><small>${D.desc}</small></div>
        ${kv('價格', money(cost))}${kv('聲望', D.prestige)}${kv('年維護', money(D.upkeep * WAN * infl))}
        <div class="act">${dbtn('buyDream', '實現它', 'buy', { id: D.id }, me.cash < cost)}</div></div>`;
    }).join('');
    c += `<h3 class="subhead">人生成就</h3><div class="achv">` + ACHIEVEMENTS.map(a => {
      const got = me.achieved[a.id];
      return `<div class="achv-item ${got ? 'on' : ''}"><b>${a.name}</b><span>${got ? `${got} 歲達成` : a.desc}</span></div>`;
    }).join('') + '</div>';
  
  const old = $('#dream .modal'), sc = old ? old.scrollTop : 0;
  $('#dream').innerHTML = `<div class="modal wide" role="dialog" aria-modal="true" aria-labelledby="dTitle">
    <div class="trade-head"><h2 id="dTitle">夢想與成就</h2><span class="cash">現金 <b class="num">${money(me.cash)}</b>　成就 <b class="num">${achievedCount(me)} / ${ACHIEVEMENTS.length}</b></span><button class="btn sm" id="dreamClose">完成</button></div>
    ${canTrade() ? '' : '<div class="readonly">現在不是你的回合，只能查看。</div>'}
    <div class="tmsg ${DW.ok ? 'ok' : 'err'}" role="status">${DW.msg}</div>${c}</div>`;
  $('#dream .modal').scrollTop = sc;
}
function dreamClick(e) {
  if (e.target.id === 'dream') return;
  if (e.target.id === 'dreamClose') return closeDream();
  const b = e.target.closest('[data-dact]'); if (!b || b.disabled || !canTrade()) return;
  const me = human(), d = b.dataset;
  let res = null;
  if (d.dact === 'buyDream') res = buyDream(me, d.id);
  if (d.dact === 'sellDream') res = sellDream(me, +d.i);
  if (res) { DW.msg = res.msg; DW.ok = res.ok; renderAll(); }
}

document.getElementById('trade').addEventListener('click', tradeClick);
document.getElementById('life').addEventListener('click', lifeClick);
document.getElementById('dream').addEventListener('click', dreamClick);
document.getElementById('rulesBtn').onclick = showRules;
document.getElementById('glossBtn').onclick = showGlossary;
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!document.getElementById('info').hidden && document.getElementById('infoClose')) document.getElementById('infoClose').click();
  else if (!document.getElementById('dream').hidden && document.getElementById('modal').hidden) closeDream();
  else if (!document.getElementById('life').hidden && document.getElementById('modal').hidden) closeLife();
  else if (!document.getElementById('trade').hidden && document.getElementById('modal').hidden) closeTrade();
});
renderSetup();
</script>
</body>
</html>
