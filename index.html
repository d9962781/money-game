<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>錢途無量：理財人生桌遊</title>
<style>
:root {
  --mat: #D6E5E8;
  --paper: #FFFFFF;
  --ink: #1F2D3A;
  --muted: #5B6B78;
  --line: #C6D4DA;
  --up: #D62839;
  --down: #0B8A57;
  --gold: #F2B01E;
  --fin: #2F6FDE;
  --life: #129A8F;
  --chance: #F2B01E;
  --fate: #8B5CD6;
  --passbook: #EEF6F1;
  --passline: #D3E6DA;
  --seal: #C1121F;
  --serif: "Noto Serif TC", "Source Han Serif TC", "Songti TC", "PMingLiU", serif;
  --sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Heiti TC", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: var(--sans); color: var(--ink); font-size: 15px; line-height: 1.55;
  background-color: var(--mat);
  background-image: radial-gradient(rgba(31,45,58,.08) 1px, transparent 1px);
  background-size: 18px 18px;
  min-height: 100vh;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--fin); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.up { color: var(--up); }
.down { color: var(--down); }
small { color: var(--muted); }
[hidden] { display: none !important; }

/* ---------- buttons ---------- */
.btn { border: 1.5px solid var(--ink); background: var(--paper); border-radius: 8px; padding: 8px 14px; font-weight: 600; }
.btn:hover:not(:disabled) { background: #F2F6F8; }
.btn.primary { background: var(--ink); color: #fff; }
.btn.primary:hover:not(:disabled) { background: #33475A; }
.btn.dice { background: var(--gold); border-color: #B98107; color: #3A2A00; font-size: 17px; padding: 10px 22px; }
.btn.dice:hover:not(:disabled) { background: #FFC43D; }
.btn.sm { padding: 4px 10px; font-size: 13px; border-width: 1px; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.buy { border-color: var(--up); color: var(--up); }
.btn.sell { border-color: var(--down); color: var(--down); }

/* ---------- setup ---------- */
#setup { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
.setup-card { background: var(--paper); border-radius: 14px; padding: 32px; max-width: 620px; width: 100%; box-shadow: 0 2px 0 var(--line); border: 1.5px solid var(--line); }
.setup-card h1 { font-family: var(--serif); font-size: 44px; margin: 0; letter-spacing: .08em; line-height: 1.2; }
.setup-card .lead { font-size: 17px; margin: 8px 0 22px; color: var(--muted); max-width: 34em; }
.form { display: grid; gap: 14px; }
.field { display: grid; gap: 6px; }
.field > span { font-weight: 600; font-size: 14px; }
.field input[type=text] { font: inherit; padding: 9px 12px; border: 1.5px solid var(--line); border-radius: 8px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1.5px solid var(--line); background: var(--paper); border-radius: 8px; padding: 6px 12px; }
.seg button[aria-pressed=true] { border-color: var(--ink); background: var(--ink); color: #fff; }
.rivals-intro { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin: 18px 0; }
.rivals-intro div { border-left: 4px solid var(--c); padding: 2px 10px; font-size: 13px; }
.rivals-intro b { display: block; font-size: 15px; }

/* ---------- layout ---------- */
#app { max-width: 1320px; margin: 0 auto; padding: 12px 16px 24px; }
.topbar { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 10px; }
.topbar h1 { font-family: var(--serif); font-size: 26px; margin: 0; letter-spacing: .08em; }
#yearInfo { font-weight: 600; }
.topbar .spacer { flex: 1; }
.main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; align-items: start; }

/* ---------- board ---------- */
#boardWrap { position: relative; width: min(100%, calc(100vh - 80px)); aspect-ratio: 1; margin: 0 auto; }
#board { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(7, 1fr); grid-template-rows: repeat(7, 1fr); gap: 3px; }
.tile { position: relative; background: var(--paper); border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 10px 2px 4px; border: 1px solid var(--line); }
.tile .band { position: absolute; left: 0; right: 0; top: 0; height: 9px; background: var(--band, var(--muted)); }
.tile .ticon { font-size: clamp(14px, 2.4vw, 26px); line-height: 1.1; }
.tile .tname { font-size: clamp(9px, 1.05vw, 13px); font-weight: 700; line-height: 1.2; }
.tile .tsub { font-size: clamp(8px, .9vw, 11px); color: var(--muted); }
.tile.corner .ticon { font-size: clamp(18px, 3vw, 34px); }
.tile.owned { box-shadow: inset 0 -6px 0 var(--owner); }
.tile .lvl { font-size: 10px; color: var(--owner); letter-spacing: -1px; }
.tile.here { outline: 3px solid var(--turn); outline-offset: -3px; }
.tokens { position: absolute; left: 2px; right: 2px; bottom: 8px; display: flex; justify-content: center; gap: 2px; }
.token { width: clamp(9px, 1.3vw, 16px); aspect-ratio: 1; border-radius: 50%; background: var(--c); border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.25); }
.k-start { --band: var(--gold); } .k-fin { --band: var(--fin); } .k-life { --band: var(--life); }
.k-chance { --band: var(--chance); } .k-fate { --band: var(--fate); } .k-tax { --band: #7A8894; }

#center { position: absolute; inset: calc(100% / 7 + 4px); background: rgba(255,255,255,.72); border-radius: 10px; padding: 14px 16px; overflow: auto; display: flex; flex-direction: column; gap: 12px; }
.news .yr { font-size: 13px; color: var(--muted); font-weight: 600; }
.news h2 { font-family: var(--serif); font-size: clamp(20px, 2.6vw, 32px); line-height: 1.25; margin: 2px 0 8px; }
.ticker { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; }
.ticker span b { font-weight: 600; }
.lesson { font-size: 13.5px; background: #FFF7DD; border-left: 4px solid var(--gold); padding: 6px 10px; border-radius: 0 6px 6px 0; }
.turn { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; border-top: 1px dashed var(--line); padding-top: 10px; }
.turn .who { font-weight: 700; display: flex; align-items: center; gap: 6px; }
.dot { width: 12px; height: 12px; border-radius: 50%; background: var(--c); display: inline-block; flex: none; }
.die { width: 38px; height: 38px; border-radius: 8px; background: var(--paper); border: 2px solid var(--ink); display: grid; place-items: center; font-weight: 800; font-size: 20px; }
.die.roll { animation: tumble .35s ease-out; }
@keyframes tumble { from { transform: rotate(-200deg) scale(.6); } to { transform: none; } }
.controls { display: grid; gap: 8px; }
.controls .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.controls .row > label { font-size: 13px; font-weight: 600; min-width: 4.5em; }
.seg.small button { padding: 3px 9px; font-size: 13px; }
.seg button small { display: none; }
.planhint { font-size: 12.5px; color: var(--muted); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.settle { font-size: 13px; background: var(--passbook); border-radius: 8px; padding: 8px 10px; }

/* ---------- side / passbook ---------- */
.side { display: grid; gap: 12px; }
.passbook { background: var(--passbook); border-radius: 12px; border: 1.5px solid #B9D3C3; overflow: hidden; }
.pb-head { background: #1E5B45; color: #fff; padding: 10px 14px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.pb-head h3 { font-family: var(--serif); margin: 0; font-size: 18px; letter-spacing: .06em; }
.pb-head span { font-size: 13px; opacity: .9; }
.pb-body { padding: 10px 14px 14px; background-image: repeating-linear-gradient(to bottom, transparent 0 27px, var(--passline) 27px 28px); }
.money-row { display: flex; justify-content: space-between; gap: 10px; }
.money-row div { display: grid; }
.money-row .lbl { font-size: 12px; color: var(--muted); }
.money-row .big { font-size: 22px; font-weight: 700; line-height: 1.2; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
.stat .lbl { font-size: 12px; display: flex; justify-content: space-between; }
.bar { height: 7px; background: rgba(31,45,58,.12); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--c, var(--ink)); }
.freedom { background: var(--paper); border-radius: 10px; padding: 10px 12px; border: 1px solid var(--passline); }
.achieved { background: var(--seal); color: #fff; border-radius: 6px; padding: 3px 8px; font-size: 12.5px; font-weight: 700; margin-bottom: 6px; display: inline-block; }
.freedom .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.freedom h4 { margin: 0; font-size: 14px; }
.freedom .pctv { font-size: 24px; font-weight: 800; font-family: var(--serif); }
.freedom .bar { height: 12px; margin: 6px 0; }
.freedom .bar i { background: linear-gradient(90deg, #2E9E6B, var(--seal)); }
.freedom .sub { font-size: 12.5px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.seals { display: flex; gap: 6px; align-items: center; margin-top: 6px; font-size: 12px; color: var(--muted); }
.seal { width: 34px; height: 34px; border-radius: 50%; border: 2px dashed #D9A5A9; display: grid; place-items: center; font-family: var(--serif); font-size: 11px; color: transparent; line-height: 1; }
.seal.on { border: 2.5px solid var(--seal); color: var(--seal); transform: rotate(-12deg); background: rgba(193,18,31,.06); font-weight: 700; }
.tabs { display: flex; gap: 2px; margin: 12px 0 6px; border-bottom: 1.5px solid #B9D3C3; }
.tabs button { background: none; border: none; padding: 6px 10px; font-size: 13.5px; font-weight: 600; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1.5px; }
.tabs button[aria-selected=true] { color: var(--ink); border-color: #1E5B45; }
.ledger { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.ledger td { padding: 3px 0; height: 28px; }
.ledger td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
.ledger tr.sum td { font-weight: 700; border-top: 1.5px solid var(--ink); }
.ledger tr.grp td { font-weight: 700; color: #1E5B45; padding-top: 8px; }
.ledger .tag { font-size: 11px; color: var(--muted); margin-left: 4px; }

.panel { background: var(--paper); border-radius: 12px; border: 1.5px solid var(--line); padding: 10px 14px; }
.panel h3 { margin: 0 0 6px; font-size: 15px; }
.rival { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; align-items: center; padding: 7px 4px; border-top: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; text-align: left; }
.rival:first-of-type { border-top: 0; }
.rival:hover { background: #F4F8F9; }
.rival .nm { font-weight: 700; font-size: 14px; }
.rival .nm small { font-weight: 400; margin-left: 4px; }
.rival .nw { font-size: 13px; text-align: right; }
.rival .bar { grid-column: 2 / 4; height: 5px; }
.rival .bar i { background: var(--c); }
#log { max-height: 260px; overflow: auto; font-size: 12.5px; display: grid; gap: 3px; }
#log div { padding: 2px 0; border-bottom: 1px dotted var(--line); }
#log .news { font-weight: 700; color: #1E5B45; }
#log .me { color: var(--ink); background: #FFF6F6; }
#log .good { color: #1E5B45; }
#log .hint { color: #8A5A00; }
#log div:not(.me):not(.news):not(.good):not(.hint) { color: var(--muted); }

/* ---------- modal ---------- */
.overlay { position: fixed; inset: 0; background: rgba(20,32,42,.45); display: grid; place-items: center; padding: 16px; z-index: 50; }
.modal { background: var(--paper); border-radius: 14px; max-width: 520px; width: 100%; max-height: calc(100vh - 32px); overflow: auto; padding: 20px 22px; box-shadow: 0 18px 40px rgba(0,0,0,.25); animation: pop .18s ease-out; }
@keyframes pop { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
.modal h2 { font-family: var(--serif); margin: 0 0 8px; font-size: 22px; }
.modal .body { margin-bottom: 14px; }
.modal .body small { display: block; margin-top: 6px; }
.modal .big { font-size: 20px; font-family: var(--serif); }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; border: 1.5px solid var(--line); background: var(--paper); border-radius: 10px; padding: 10px 14px; display: grid; gap: 2px; }
.opt:hover:not(:disabled) { border-color: var(--ink); background: #F6F9FA; }
.opt b { font-weight: 600; }
.opt span { font-size: 12.5px; color: var(--muted); }
.opt:disabled { opacity: .5; cursor: not-allowed; }
.opt.single { text-align: center; background: var(--ink); color: #fff; border-color: var(--ink); }
.opt.single:hover { background: #33475A !important; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 4px; }
.chip { font-size: 13px; padding: 2px 10px; border-radius: 99px; border: 1.5px solid currentColor; font-weight: 600; }
.chip.neu { color: var(--muted); }

.modal.wide { max-width: 900px; }
.trade-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.trade-head .cash { font-size: 14px; }
.ttabs { display: flex; flex-wrap: wrap; gap: 4px; margin: 12px 0; }
.ttabs button { border: 1.5px solid var(--line); background: var(--paper); border-radius: 99px; padding: 5px 14px; font-weight: 600; font-size: 14px; }
.ttabs button[aria-selected=true] { background: var(--ink); border-color: var(--ink); color: #fff; }
.tip { background: #F1F6FC; border-left: 4px solid var(--fin); padding: 8px 12px; font-size: 13.5px; border-radius: 0 8px 8px 0; margin-bottom: 10px; }
.tmsg { min-height: 24px; font-size: 14px; font-weight: 600; margin: 6px 0; }
.tmsg.err { color: var(--up); }
.tmsg.ok { color: #1E5B45; }
.readonly { font-size: 13px; color: var(--up); font-weight: 600; }
.asset { border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; display: grid; grid-template-columns: minmax(150px, 1.6fr) repeat(auto-fit, minmax(84px, 1fr)); gap: 6px 12px; align-items: center; }
.asset .nm b { display: block; }
.asset .nm small { display: block; line-height: 1.35; }
.kv { display: grid; font-size: 13.5px; }
.kv .lbl { font-size: 11.5px; color: var(--muted); }
.act { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.act input { width: 120px; font: inherit; padding: 4px 8px; border: 1.5px solid var(--line); border-radius: 6px; }
.subhead { font-size: 15px; margin: 16px 0 8px; }
.empty { font-size: 13.5px; color: var(--muted); padding: 6px 0; }

.puzzle { background: #F7FAFB; border: 1.5px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; font-size: 15.5px; line-height: 1.7; white-space: normal; }
.puzzle code, .puzzle { font-variant-numeric: tabular-nums; }

/* ---------- 感情 ---------- */
.pcard { border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; background: #FDF7F7; }
.pname { font-family: var(--serif); font-size: 19px; font-weight: 700; margin-bottom: 6px; }
.pname span { font-family: var(--sans); font-size: 13px; font-weight: 400; color: var(--muted); }
.prow { font-size: 13.5px; padding: 3px 0; border-top: 1px dotted var(--line); display: flex; flex-wrap: wrap; gap: 2px 8px; }
.prow b { min-width: 5.5em; font-weight: 600; }
.prow small { color: var(--muted); }
.relbar { height: 8px; background: rgba(31,45,58,.12); border-radius: 4px; overflow: hidden; margin-bottom: 6px; }
.relbar i { display: block; height: 100%; background: linear-gradient(90deg, #E0728A, #C1121F); }

/* ---------- 結局 ---------- */
.ending { border: 2px solid var(--seal); border-radius: 12px; padding: 14px 16px; margin: 12px 0; background: #FFF8F8; }
.ending-name { font-family: var(--serif); font-size: 24px; font-weight: 800; color: var(--seal); margin-bottom: 4px; }
.ending p { margin: 0; font-size: 14.5px; }

/* ---------- 成就 ---------- */
.achv { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 6px; }
.achv-item { border: 1.5px solid var(--line); border-radius: 8px; padding: 6px 10px; opacity: .45; }
.achv-item.on { opacity: 1; border-color: var(--gold); background: #FFFBEF; }
.achv-item b { display: block; font-size: 13.5px; }
.achv-item span { font-size: 11.5px; color: var(--muted); }

/* ---------- charts & events ---------- */
.kline { width: 100%; height: auto; display: block; background: #FBFCFD; border: 1px solid var(--line); border-radius: 8px; margin: 6px 0; }
.chartbox { border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 14px; }
.chartbar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.chartsum { font-size: 14px; margin-top: 8px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; margin-right: 4px; vertical-align: -1px; }
.lg-up { background: #D62839; } .lg-down { background: #0B8A57; } .lg-ma { height: 3px !important; background: #E0A100; vertical-align: 3px !important; }
.newslist { list-style: none; padding: 0; margin: 8px 0 0; font-size: 13px; border-top: 1px dashed var(--line); }
.newslist li { padding: 4px 0; display: flex; gap: 10px; flex-wrap: wrap; }
.newslist .num { color: var(--muted); min-width: 7.5em; }
.impact { background: var(--passbook); border: 1px solid #B9D3C3; border-radius: 10px; padding: 8px 12px; margin: 8px 0; }
.impact-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; font-size: 14px; }
.impact-top b { font-size: 22px; font-family: var(--serif); }
.impact .ledger td { height: 24px; }
.note { border-left: 4px solid var(--fate); background: #F6F2FD; padding: 7px 12px; border-radius: 0 8px 8px 0; margin: 8px 0; font-size: 14px; }
.note small { display: block; margin-top: 4px; }
.note.recap { border-color: var(--fin); background: #F1F6FC; }
.evmeta { margin: -4px 0 4px; color: var(--muted); font-size: 13.5px; }
.fc { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin: 8px 0; }
.fc-top { display: flex; justify-content: space-between; }
.fc .bar { height: 8px; margin: 5px 0; } .fc .bar i { background: var(--fin); }
.fc .chips { margin: 4px 0 0; }
#center .impact { margin: 0; }

/* ---------- end screen ---------- */
.end-seal { width: 150px; height: 150px; border-radius: 50%; border: 6px solid var(--seal); color: var(--seal); display: grid; place-items: center; margin: 6px auto 12px; font-family: var(--serif); font-size: 30px; font-weight: 800; line-height: 1.15; text-align: center; transform: rotate(-14deg); animation: stamp .5s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes stamp { from { transform: rotate(-14deg) scale(2.2); opacity: 0; } to { transform: rotate(-14deg) scale(1); opacity: 1; } }
.rank { width: 100%; border-collapse: collapse; font-size: 14px; margin: 8px 0; }
.rank th, .rank td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: right; }
.rank th:first-child, .rank td:first-child, .rank th:nth-child(2), .rank td:nth-child(2) { text-align: left; }
.chart { width: 100%; height: auto; background: #FAFCFD; border-radius: 8px; border: 1px solid var(--line); }
.list { padding-left: 1.2em; margin: 6px 0; }
.list li { margin: 3px 0; }
dl.gloss dt { font-weight: 700; margin-top: 10px; }
dl.gloss dd { margin: 2px 0 0; color: var(--muted); }

@media (max-width: 1000px) {
  .main { grid-template-columns: 1fr; }
  #boardWrap { width: 100%; max-width: 720px; }
}
@media (max-width: 720px) {
  #app { padding: 8px; }
  #boardWrap { aspect-ratio: auto; }
  #board { position: relative; aspect-ratio: 1; gap: 2px; }
  .tile { padding: 7px 1px 2px; border-radius: 4px; }
  .tile .band { height: 5px; }
  .tile .tsub { display: none; }
  #center { position: static; margin-top: 10px; background: var(--paper); border: 1.5px solid var(--line); }
  .setup-card { padding: 22px; }
  .setup-card h1 { font-size: 34px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

</style>
</head>
<body>
<section id="setup"></section>
<div id="app" hidden>
  <header class="topbar">
    <h1>錢途無量</h1>
    <span id="yearInfo"></span>
    <span class="spacer"></span>
    <button class="btn sm" id="rulesBtn">遊戲規則</button>
    <button class="btn sm" id="glossBtn">理財小辭典</button>
  </header>
  <div class="main">
    <div id="boardWrap">
      <div id="board"></div>
      <div id="center" aria-live="polite"></div>
    </div>
    <aside class="side">
      <div id="pb"></div>
      <div class="panel" id="rivals"></div>
      <div class="panel"><h3>紀錄</h3><div id="log"></div></div>
    </aside>
  </div>
</div>

const rnd = (a, b) => a + Math.floor(R() * (b - a + 1));
const pick = arr => arr[Math.floor(R() * arr.length)];
// 產生一題：正解 + 干擾選項，隨機打亂
function mkQ(q, correct, wrongs, e) {
  const seen = new Set([String(correct)]), keep = [];
  wrongs.forEach(w => { const s = String(w); if (!seen.has(s)) { seen.add(s); keep.push(s); } });
  const opts = shuffle([String(correct), ...keep.slice(0, 3)]);
  return { q, o: opts, a: opts.indexOf(String(correct)), e };
}
const nearby = (v, n, spread) => { const out = new Set(); let g = 0; while (out.size < n && g++ < 200) { const d = Math.round(v * (0.05 + R() * spread) * (R() < 0.5 ? -1 : 1)); if (d && v + d > 0) out.add(v + d); } return [...out]; };
// 產生「格式化後也不會重複」的金額干擾選項
const SIT = pool => () => { const c = pick(pool); return mkQ(c.q, c.a, c.w, c.e); };
const nearbyMoney = (v, n, spread) => {
  const out = [], seen = new Set([money(v)]);
  let g = 0, sp = spread;
  while (out.length < n && g++ < 300) {
    const d = Math.round(v * (0.06 + R() * sp) * (R() < 0.5 ? -1 : 1));
    if (!d || v + d <= 0) continue;
    const s = money(v + d);
    if (seen.has(s)) { sp += 0.02; continue; }
    seen.add(s); out.push(s);
  }
  return out;
};

const affinityOf = p => (p.major ? MAJORS[p.major].affinity : []);
const hasAffinity = (p, jobId) => affinityOf(p).includes(jobId) || (p.internship && p.internship === jobId);
function eduReq(p, j) { return Math.max(0, j.edu - (hasAffinity(p, j.id) ? 12 : 0)); }
function canApply(p, j) {
  return p.edu >= eduReq(p, j) && netEff(p) >= j.net && appearance(p) >= (j.app || 0)
    && p.workYears >= (j.exp || 0) && hasLicense(p, j.id) && !onCooldown(p, j.id);
}
function onCooldown(p, jobId) { return (p.jobCooldown[jobId] || 0) > G.round; }
function applyBlock(p, j) {
  const miss = [];
  if (!hasLicense(p, j.id)) miss.push(`${LICENSES[j.id].name}及格`);
  if (onCooldown(p, j.id)) miss.push(`上次落榜，${p.jobCooldown[j.id] - G.round} 年後才能再考`);
  if (p.edu < eduReq(p, j)) miss.push(`學識 ${eduReq(p, j)}`);
  if (netEff(p) < j.net) miss.push(`有效人脈 ${j.net}${p.net >= j.net ? `（認識的人夠了，但門面撐不起來，上限只有 ${netCap(p)}）` : ''}`);
  if (appearance(p) < (j.app || 0)) miss.push(`門面 ${j.app}（目前 ${appearance(p)}）`);
  if (p.workYears < (j.exp || 0)) miss.push(`工作經驗 ${j.exp} 年`);
  return miss.join('、');
}
// 有證照的職業，證照考試才是真正的門檻，面試就不用再刁難一次
const jobStages = j => Math.max(1, (j.salary >= 150 ? 4 : j.salary >= 85 ? 3 : j.salary >= 45 ? 2 : 1) - (LICENSES[j.id] ? 1 : 0));

// 學識與人脈決定難度、重試次數與提示
function puzzleSetup(p, j) {
  const stages = Math.max(1, jobStages(j) - (netEff(p) >= 70 && R() < 0.6 ? 1 : 0));
  const gap = p.edu - eduReq(p, j);
  const d = gap >= 25 ? 0 : gap >= 10 ? 1 : 2;
  const retries = (p.edu >= 80 ? 2 : p.edu >= 55 ? 1 : 0) + (hasAffinity(p, j.id) ? 1 : 0);
  return { stages, d, retries };
}

// 抽題：避開這名玩家最近看過的題目
function drawQ(p, gens, d) {
  let best = null;
  for (let i = 0; i < 25; i++) {
    const q = gens[Math.floor(R() * gens.length)](d);
    if (!p.qSeen.includes(q.q)) { best = q; break; }
    if (!best) best = q;
  }
  p.qSeen.unshift(best.q);
  if (p.qSeen.length > 40) p.qSeen.pop();
  return best;
}

async function runPuzzle(p, job, label) {
  const gens = PUZZLES[job.id] || PUZZLES.admin, cfg = puzzleSetup(p, job);
  let retries = cfg.retries, cleared = 0;
  for (let s = 0; s < cfg.stages; s++) {
    let ok = false;
    while (true) {
      const q = drawQ(p, gens, cfg.d);
      const v = await ask(p, { title: `${label}　第 ${s + 1} 關／共 ${cfg.stages} 關`,
        body: `<div class="puzzle">${esc(q.q).replace(/\n/g, '<br>')}</div>${retries ? `<small>答錯還可以重試 ${retries} 次</small>` : '<small>沒有重試機會了，請謹慎作答</small>'}`,
        options: q.o.map((t, i) => ({ label: t, value: i })), ai: () => 0 });
      if (v === q.a) { ok = true; await tell(p, '答對了', `${esc(q.q).replace(/\n/g, '<br>')}<br><br><b>${q.o[q.a]}</b><br><br>${q.e}`, null); break; }
      if (retries > 0) { retries--; await tell(p, '答錯了，換一題再試', `正確答案是「${q.o[q.a]}」。<br><br>${q.e}<br><br>還有 ${retries + 1} 次機會，換一題。`, null); continue; }
      await tell(p, '答錯了', `正確答案是「${q.o[q.a]}」。<br><br>${q.e}`, null);
      break;
    }
    if (!ok) break;
    cleared++;
  }
  return { passed: cleared === cfg.stages, cleared, stages: cfg.stages };
}

// 電腦玩家不解謎，直接換算通過機率
function aiPuzzle(p, job) {
  const cfg = puzzleSetup(p, job);
  let per = clamp(0.5 + (p.edu - eduReq(p, job)) / 110 + (hasAffinity(p, job.id) ? 0.15 : 0), 0.32, 0.94);
  let cleared = 0, retries = cfg.retries;
  for (let s = 0; s < cfg.stages; s++) {
    let ok = R() < per;
    while (!ok && retries > 0) { retries--; ok = R() < per; }
    if (!ok) break;
    cleared++;
  }
  return { passed: cleared === cfg.stages, cleared, stages: cfg.stages };
}

// 降級錄取：找一份比較低階、他也符合資格的工作
function fallbackJob(p, j) {
  const lower = JOBS.filter(x => x.salary < j.salary && canApply(p, x) && x.id !== p.job).sort((a, b) => b.salary - a.salary);
  return lower[0] || null;
}

async function applyJob(p, j, label) {
  if (j.campaign) {
    const fee = j.campaign * WAN * G.market.infl;
    if (p.cash < fee) { await tell(p, '競選經費不足', `參選「${j.name}」需要先籌措 ${money(fee)} 的競選經費。`, null); return 'fail'; }
    const go = await ask(p, { title: `要投入 ${money(fee)} 參選嗎？`, body: `競選經費不論當選與否都不會退還。你目前的有效人脈是 ${netEff(p)}、門面 ${appearance(p)}。<br><small>選舉是人脈與資源的總體戰，落選就是全部歸零。</small>`,
      options: [{ label: '投入競選', value: 1 }, { label: '再考慮', value: 0 }], ai: pp => (pp.cash > fee * 4 ? 1 : 0) });
    if (!go) return 'fail';
    p.cash -= fee;
    IO.log(`${p.name} 投入 ${money(fee)} 參選${j.name}`, p.isHuman ? 'me' : '');
  }
  const res = p.isHuman ? await runPuzzle(p, j, label || `${j.name}　面試`) : aiPuzzle(p, j);
  if (res.passed) {
    p.job = j.id; p.status = 'employed'; p.salary = jobSalary(p, j) * (p.internship === j.id ? 1.1 : 1); ensurePlan(p);
    await tell(p, '錄取了', `恭喜！你通過了${j.name}的面試，年薪 ${money(p.salary)}。${p.internship === j.id ? '<br><small>相關實習經驗讓你多爭取到 10% 起薪。</small>' : ''}`, `${p.name} 通過面試，成為${j.name}`);
    return 'pass';
  }
  const ratio = res.cleared / res.stages;
  if (R() < ratio) {
    const fb = fallbackJob(p, j);
    if (fb) {
      p.job = fb.id; p.status = 'employed'; p.salary = jobSalary(p, fb); ensurePlan(p);
      await tell(p, '沒通過，但拿到另一個機會', `你在第 ${res.cleared + 1} 關被刷下來，不過公司覺得你適合另一個職位，錄取你為${fb.name}，年薪 ${money(p.salary)}。<br><small>先進去累積經驗和年資，之後再往上爬也是一條路。</small>`, `${p.name} 面試${j.name}未過，改錄取為${fb.name}`);
      return 'down';
    }
  }
  if (j.campaign) { p.health = clamp(p.health - 6, 0, 100); await tell(p, '落選了', '你在這場選舉中落敗，競選經費全部付諸流水，健康 -6。兩年內不能再參選。<br><small>選舉的沉沒成本非常高，投入前要算清楚。</small>', `${p.name} 參選落敗`); return 'fail'; }
  await tell(p, '這次沒有錄取', `你通過了 ${res.cleared} 關，在第 ${res.cleared + 1} 關被刷下來。<br><small>可以先進修提高學識，讓題目變簡單、重試次數變多，明年再試一次。</small>`, `${p.name} 應徵${j.name}落榜`);
  return 'fail';
}

// ---------- 證照考試 ----------
async function licenseExam(p, jobId) {
  const L = LICENSES[jobId], fee = L.fee * WAN * G.market.infl;
  if (p.edu < L.edu) { await tell(p, '報名資格不符', `${L.name}需要學識 ${L.edu}，你目前是 ${p.edu}。先去進修學院或選擇下班進修。`, null); return false; }
  if (p.cash < fee) { await tell(p, '報名費不足', `${L.name}報名費 ${money(fee)}。`, null); return false; }
  p.cash -= fee;
  const j = JOBS.find(x => x.id === jobId);
  const gens = PUZZLES[jobId], aff = hasAffinity(p, jobId);
  let retries = L.retry + (p.edu >= 90 ? 1 : 0) + (aff ? 1 : 0), cleared = 0;
  if (p.isHuman) {
    for (let s = 0; s < L.stages; s++) {
      let ok = false;
      while (true) {
        const q = drawQ(p, gens, p.edu >= 90 ? 1 : 2);
        const v = await ask(p, { title: `${L.name}　第 ${s + 1} 科／共 ${L.stages} 科`,
          body: `<div class="puzzle">${esc(q.q).replace(/\n/g, '<br>')}</div>${retries ? `<small>還可以重考 ${retries} 次</small>` : '<small>沒有重考機會了</small>'}`,
          options: q.o.map((t, i) => ({ label: t, value: i })) });
        if (v === q.a) { ok = true; await tell(p, '這科過了', `${q.e}`, null); break; }
        if (retries > 0) { retries--; await tell(p, '這科沒過，換一題重考', `正確答案是「${q.o[q.a]}」。<br><br>${q.e}`, null); continue; }
        await tell(p, '這科沒過', `正確答案是「${q.o[q.a]}」。<br><br>${q.e}`, null);
        break;
      }
      if (!ok) break;
      cleared++;
    }
  } else {
    const per = clamp(0.5 + (p.edu - L.edu) / 90 + (aff ? 0.12 : 0), 0.3, 0.92);
    for (let s = 0; s < L.stages; s++) {
      let ok = R() < per;
      while (!ok && retries > 0) { retries--; ok = R() < per; }
      if (!ok) break;
      cleared++;
    }
  }
  if (cleared === L.stages) {
    p.licenses[jobId] = true; p.edu = clamp(p.edu + 3, 0, 100);
    await tell(p, `${L.name}及格`, `恭喜！你取得資格，現在可以應徵「${L.job}」了。學識 +3。`, `${p.name} 考取${L.name}`);
    if (canApply(p, j) && p.job !== jobId) {
      const now = p.status === 'employed' ? `目前年薪 ${money(p.salary)}` : '你目前沒有工作';
      const go = await ask(p, { title: '要現在去面試嗎？', body: `「${L.job}」年薪約 ${money(jobSalary(p, j))}，${now}。`,
        options: [{ label: '馬上去面試', value: 1, hint: `面試 ${jobStages(j)} 關` }, { label: '之後再說', value: 0 }],
        ai: pp => (jobSalary(pp, j) > pp.salary * 1.05 ? 1 : 0) });
      if (go) { const before = p.salary; const r = await applyJob(p, j, `${j.name}　面試`); if (r === 'fail' && p.status === 'employed') p.salary = before; }
    }
    return true;
  }
  p.licenseCooldown[jobId] = G.round + 1;
  await tell(p, `${L.name}沒有及格`, `你通過 ${cleared} 科，在第 ${cleared + 1} 科卡關，報名費 ${money(fee)} 不退還。明年可以再報考。<br><small>專業證照本來就不容易，先把學識養高，題目會變簡單、重考次數也變多。</small>`, `${p.name} 的${L.name}未及格`);
  return false;
}

async function chooseMajor(p) {
  const opts = Object.entries(MAJORS).map(([k, m]) => ({ label: m.name, value: k,
    hint: `${m.years ? `${m.years} 年制　學費 ${m.tuition === 0 ? '無' : `×${m.tuition}`}　` : ''}學識 +${m.edu}${m.net ? `、人脈 +${m.net}` : ''}　${m.desc}` }));

    options: opts, ai: pp => pick(['biz', 'cs', 'med', 'edu', 'comm', 'voc'].filter(k => (pp.persona === 'scholar' ? k !== 'voc' : true) && (pp.persona === 'social' ? k !== 'med' : true))) });

async function internshipOffer(p) {
  p.internTried = true;
  const cands = JOBS.filter(j => j.salary >= 45 && p.edu >= eduReq(p, j) - 15);
  if (!cands.length) return;
  const j = hasAffinity(p, cands[cands.length - 1].id) ? cands[cands.length - 1] : pick(cands);
  const v = await ask(p, { title: '實習機會', body: `一家公司開出「${j.name}」的實習缺，要先通過一關測驗。實習過的領域，畢業求職時題目會變簡單、還能多拿 10% 起薪。`,
    options: [{ label: '爭取實習', value: 1 }, { label: '專心念書', value: 0 }], ai: () => (R() < 0.7 ? 1 : 0) });
  if (!v) return;
  const gens = PUZZLES[j.id] || PUZZLES.admin;
  let ok;
  if (p.isHuman) {
    const q = drawQ(p, gens, 1);
    const ans = await ask(p, { title: `${j.name}　實習測驗`, body: `<div class="puzzle">${esc(q.q).replace(/\n/g, '<br>')}</div>`, options: q.o.map((t, i) => ({ label: t, value: i })) });
    ok = ans === q.a;
    await tell(p, ok ? '錄取實習' : '沒有錄取', ok ? `你答對了，順利進入公司實習。<br><br>${q.e}` : `正確答案是「${q.o[q.a]}」。<br><br>${q.e}`, null);
  } else ok = R() < clamp(0.4 + p.edu / 150, 0, 0.9);
  if (ok) {
    p.internship = j.id; p.edu = clamp(p.edu + 5, 0, 100); p.net = clamp(p.net + 5, 0, 100); p.cash += 6 * WAN * G.market.infl;
    IO.log(`${p.name} 取得${j.name}實習資格`, 'good');
  }
}

// ================= 門面與健康 =================
// app 門面分、upkeep 年度維護費（萬）、depr 年折舊率、cat 類別
// 精品（lux）不折舊，價值跟著金價和市場波動，偶爾還會升值
const ITEMS = [
  { id: 'scooter', name: '機車', cat: 'vehicle', cost: 8, app: 6, upkeep: 0.8, depr: 0.12, desc: '代步工具。通勤方便，門面加分有限。' },
  { id: 'car', name: '國產汽車', cat: 'vehicle', cost: 70, app: 16, upkeep: 4.5, depr: 0.13, desc: '接送客戶、拜訪長輩都得體。每年要付保養、保險和牌照燃料稅。' },
  { id: 'impcar', name: '進口轎車', cat: 'vehicle', cost: 180, app: 28, upkeep: 8, depr: 0.15, desc: 'business 場合的常見選擇。維修零件貴，折舊也快。' },
  { id: 'luxcar', name: '豪華房車', cat: 'vehicle', cost: 450, app: 40, upkeep: 15, depr: 0.16, desc: '門面最強，但一落地就開始跌，養車費用驚人。' },
  { id: 'suit', name: '基本正裝', cat: 'apparel', cost: 3, app: 8, upkeep: 0.5, depr: 0.3, desc: '最划算的門面投資：一套得體的衣服，讓你在正式場合不失禮。' },
  { id: 'tailor', name: '訂製西裝與禮服', cat: 'apparel', cost: 15, app: 16, upkeep: 1, depr: 0.25, desc: '合身剪裁，在高階場合更有說服力。' },
  { id: 'bag', name: '名牌包', cat: 'luxury', cost: 12, app: 10, upkeep: 0, lux: true, desc: '經典款保值性不錯，但二手轉賣會有價差。' },
  { id: 'watch', name: '入門名錶', cat: 'luxury', cost: 25, app: 14, upkeep: 0.3, lux: true, desc: '商務場合的常見配件，熱門型號相對保值。' },
  { id: 'watch2', name: '高級名錶', cat: 'luxury', cost: 120, app: 26, upkeep: 1, lux: true, desc: '稀有款可能隨行情上漲，但流動性差，急用錢時不好脫手。' },
  { id: 'jewel', name: '珠寶首飾', cat: 'luxury', cost: 60, app: 18, upkeep: 0.5, lux: true, desc: '價值跟著金價走，兼具裝飾和保值功能。' },
];
const ITEM = Object.fromEntries(ITEMS.map(x => [x.id, x]));
const RESALE = { vehicle: 0.85, apparel: 0.4, luxury: 0.82 };

// 同類別只有最好的那件完全計分，其餘遞減（穿戴不了兩支錶）
const CAT_W = [1, 0.35, 0.15];
// 車子和衣服會變舊，舊了就撐不起場面（精品不受影響）
function condition(it) {
  const I = ITEM[it.id];
  if (I.lux) return 1;
  const ratio = it.value / (I.cost * WAN * G.market.infl);
  return ratio >= 0.35 ? 1 : ratio >= 0.18 ? 0.7 : 0.45;
}
const condLabel = it => (condition(it) === 1 ? '狀況良好' : condition(it) === 0.7 ? '有點舊了' : '相當老舊，門面效果打折');
function appearanceRaw(p) {
  const byCat = {};
  (p.items || []).forEach(it => { (byCat[ITEM[it.id].cat] = byCat[ITEM[it.id].cat] || []).push(ITEM[it.id].app * condition(it)); });
  let raw = 0;
  Object.values(byCat).forEach(list => { list.sort((a, b) => b - a).forEach((v, i) => { raw += v * (CAT_W[i] || 0.05); }); });
  return raw;
}
// 邊際效益遞減：從沒有到「得體」進步最大，往上堆頂級效果很小
const appearance = p => Math.round(100 * appearanceRaw(p) / (appearanceRaw(p) + 55));
// 有效人脈：門面撐不起來，認識再多人也使不上力
const netCap = p => Math.round(45 + appearance(p) * 0.55);
const netEff = p => Math.min(p.net, netCap(p));
const itemsValue = p => (p.items || []).reduce((s, it) => s + it.value, 0);
const itemsUpkeep = p => (p.items || []).reduce((s, it) => s + ITEM[it.id].upkeep, 0) * WAN * G.market.infl;

function buyItem(p, id) {
  const I = ITEM[id];
  if (!I) return { ok: false, msg: '找不到這個項目' };
  if ((p.items || []).some(x => x.id === id)) return { ok: false, msg: '你已經有一件了' };
  const cost = I.cost * WAN * G.market.infl;
  if (p.cash < cost) return { ok: false, msg: `現金不足，需要 ${money(cost)}` };
  p.cash -= cost; p.items.push({ id, value: cost });
  IO.log(`${p.name} 買了${I.name}`, p.isHuman ? 'me' : '');
  return { ok: true, msg: `買進${I.name}，花了 ${money(cost)}。門面 ${appearance(p)}，有效人脈上限 ${netCap(p)}。${I.upkeep ? `每年維護費 ${money(I.upkeep * WAN * G.market.infl)}。` : ''}` };
}
function sellItem(p, i) {
  const it = p.items[i]; if (!it) return { ok: false, msg: '找不到這個項目' };
  const I = ITEM[it.id], get = it.value * RESALE[I.cat];
  p.cash += get; p.items.splice(i, 1);
  IO.log(`${p.name} 賣掉${I.name}`, p.isHuman ? 'me' : '');
  return { ok: true, msg: `賣出${I.name}，拿回 ${money(get)}（二手價差 ${money(it.value - get)}）` };
}
// 每年更新價值：車和衣服折舊，精品跟著金價走
function ageItems(p) {
  const gold = G.market.ret.GOLD || 0;
  (p.items || []).forEach(it => {
    const I = ITEM[it.id];
    it.value = I.lux ? Math.max(I.cost * WAN * 0.3, it.value * (1 + 0.005 + gold * 0.35 + gauss() * 0.03))
      : Math.max(I.cost * WAN * 0.05, it.value * (1 - I.depr));
  });
}

// ---------- 健康方案：主動花錢維持健康 ----------
const WELLNESS = {
  gym: { name: '健身房會員', cost: 3, health: 5, desc: '每年 +5 健康' },
  checkup: { name: '定期健康檢查', cost: 2, health: 3, desc: '每年 +3 健康，早期發現問題，大病機率減半' },
  trainer: { name: '私人教練與營養規劃', cost: 6, health: 8, desc: '每年 +8 健康' },
};
const wellnessCost = p => Object.keys(WELLNESS).reduce((s, k) => s + (p.wellness[k] ? WELLNESS[k].cost : 0), 0) * WAN * G.market.infl;
const wellnessGain = p => Object.keys(WELLNESS).reduce((s, k) => s + (p.wellness[k] ? WELLNESS[k].health : 0), 0);

// 工作對健康的消耗：工作壓力 + 高薪的代價 + 年齡
function healthDrain(p) {
  if (p.retired) return 0;
  if (p.status !== 'employed') return p.status === 'student' ? 0 : 0.5;
  const j = JOBS.find(x => x.id === p.job), infl = G.market.infl;
  const stress = j.stress / 5;
  const payToll = Math.max(0, (p.salary / WAN / infl - 55) / 58);
  const ageToll = Math.max(0, (p.age - 35) / 14);
  return stress + payToll + ageToll;
}

// 電腦玩家：先買撐得起的門面，再視收入加購健康方案
function aiLifestyleStep(p) {
  if (p.status === 'student') return;
  const P = PERSONAS[p.persona], cf = cashflow(p), income = cf.totA + cf.totP;
  const reserve = Math.max(cf.totE, 10 * WAN) * P.reserve;
  const wants = { social: ['suit', 'car', 'watch', 'tailor', 'impcar'], gambler: ['suit', 'car', 'watch2', 'luxcar'], scholar: ['suit', 'car', 'watch'], saver: ['suit', 'scooter', 'car'] }[p.persona];
  if (!p.items.some(x => x.id === 'suit') && p.cash > 8 * WAN * G.market.infl) buyItem(p, 'suit');
  for (const id of wants) {
    const I = ITEM[id], cost = I.cost * WAN * G.market.infl;
    if (p.items.some(x => x.id === id)) continue;
    const worth = p.net > netCap(p) || JOBS.some(j => canApply(p, j) && (j.app || 0) > appearance(p) && j.salary > (p.salary / WAN / G.market.infl));
    if (!worth) break;
    if (p.cash - cost < reserve || itemsUpkeep(p) + I.upkeep * WAN * G.market.infl > income * 0.1) break;
    buyItem(p, id);
  }
  if (p.health < 68 && income > 70 * WAN * G.market.infl) {
    if (!p.wellness.gym) p.wellness.gym = true;
    else if (!p.wellness.checkup && income > 90 * WAN * G.market.infl) p.wellness.checkup = true;
    else if (!p.wellness.trainer && p.health < 55 && income > 150 * WAN * G.market.infl) p.wellness.trainer = true;
  }
  if (p.cash < 0 || (cf.net < 0 && p.items.length)) {
    const idx = p.items.map((it, i) => ({ i, up: ITEM[it.id].upkeep })).sort((a, b) => b.up - a.up)[0];
    if (idx && idx.up > 5) sellItem(p, idx.i);
  }
}

// 電腦玩家的退休與夢想清單
async function aiEndgameStep(p) {
  if (!p.retired && p.freedomAge != null && p.age >= 55 && p.status === 'employed' && R() < 0.3) await quitJob(p, true);
  const h = holdings(p), cf = cashflow(p);
  const spare = h.net - cf.rec * 25;
  if (spare > 0) {
    const cand = DREAMS.filter(D => !(p.dreams || []).some(x => x.id === D.id)
      && p.cash > D.cost * WAN * G.market.infl * 2.5 && D.upkeep * WAN * G.market.infl < cf.totP * 0.12);
    if (cand.length && R() < 0.35) buyDream(p, pick(cand).id);
  }
}

// 電腦玩家的約會安排：依關係狀況和口袋深度挑一個行程
function aiDateStep(p) {
  const pt = p.partner; if (!pt) return;
  const cf = cashflow(p), room = Math.max(0, cf.totA + cf.totP - cf.totE);
  const cap = STAGES[pt.stage].cap;
  if (pt.rel >= cap - 2 && !pt.pending) return;
  // 缺多少補多少：好感度離上限越遠，才捨得花錢
  const need = pt.pending ? STAGES[pt.stage].next - pt.rel + 4 : Math.min(cap - pt.rel, 7);
  const budget = Math.max(0, room * (pt.rel < 40 ? 0.45 : 0.18));
  let left = need;
  for (let k = 0; k < DATE_SLOTS; k++) {
    if (left <= 0 && k > 0) break;
    const afford = DATES.filter(d => d.stage <= pt.stage && !(p.dateActs || []).includes(d.id)
      && dateReal(p, d) <= Math.min(budget, p.cash * 0.35));
    if (!afford.length) { doDate(p, 'msg'); break; }
    const fit = afford.find(d => d.rel >= left) || afford[afford.length - 1];
    const res = doDate(p, fit.id);
    if (!res.ok) break;
    left -= fit.rel;
  }
}

function doDate(p, id) {
  const d = DATES.find(x => x.id === id), pt = p.partner;
  if (!pt) return { ok: false, msg: '你現在沒有對象' };
  const used = p.dateActs || (p.dateActs = []);
  if (used.includes(id)) return { ok: false, msg: '這個活動這半年已經安排過了' };
  if (used.length >= DATE_SLOTS) return { ok: false, msg: `這半年最多安排 ${DATE_SLOTS} 項活動` };
  if (d.stage > pt.stage) return { ok: false, msg: `要到「${STAGES[d.stage].name}」才能安排這個行程` };
  const cost = dateReal(p, d);
  if (p.cash < cost) return { ok: false, msg: `現金不足，需要 ${money(cost)}` };
  const bonus = d.hobby ? 4 : 0;
  const cap = STAGES[pt.stage].cap;

  p.cash -= cost; pt.rel = Math.min(cap, pt.rel + d.rel + bonus);
  if (d.health) p.health = clamp(p.health + d.health, 0, 100);
  if (id === 'abroad') p.tripCount = (p.tripCount || 0) + 1;

async function wedding(p) {
  const pt = p.partner, infl = G.market.infl;
  const help = pt.bg === 'rich' ? 60 * WAN * infl : 0;
  const opts = [
    { label: '公證結婚', value: 'simple', hint: `約 ${money(4 * WAN * infl)}　關係 +4` },
    { label: '一般婚宴', value: 'normal', hint: `淨支出約 ${money(45 * WAN * infl)}（已扣禮金）　關係 +9、人脈 +5` },
    { label: '盛大婚禮', value: 'grand', hint: `淨支出約 ${money(160 * WAN * infl)}　關係 +14、人脈 +12` },
  ];
  const v = await ask(p, { title: '婚禮要辦多大？', body: `婚禮是一次性的支出，但這筆錢也可以是頭期款或投資本金。${help ? `<br>${pt.name}的長輩表示願意資助 ${money(help)}。` : ''}`,
    options: opts, ai: pp => { const cash = pp.cash / WAN / infl; return cash > 400 && pp.lifestyle === 'enjoy' ? 'grand' : cash > 150 ? 'normal' : 'simple'; } });
  const cost = { simple: 4, normal: 45, grand: 160 }[v] * WAN * infl;
  const rel = { simple: 4, normal: 9, grand: 14 }[v], net = { simple: 0, normal: 5, grand: 12 }[v];
  p.cash -= cost - help; p.married = true; pt.rel = clamp(pt.rel + rel, 0, 100);
  p.net = clamp(p.net + net + (TRAITS[pt.trait].net || 0), 0, 100); p.health = clamp(p.health + 4, 0, 100);
  if (pt.homeWilling) {
    const stay = await ask(p, { title: '婚後的家庭分工', body: `${pt.name}願意為家庭放下工作。雙薪收入較高，但育兒和家事會很吃緊；一方顧家則少一份收入，孩子的照顧和你們的關係會比較好。`,
      options: [{ label: `維持雙薪（年收入 ${money(pt.income)}）`, value: 0 },
        { label: `${pt.name}顧家`, value: 1, hint: '少一份收入，但育兒費降約四成、關係每年 +5' }],
      ai: () => (pt.income < 45 * WAN * infl && R() < 0.6 ? 1 : 0) });
    pt.homemaker = !!stay;
  }
  p.spouseIncome = partnerIncome(pt);
  await tell(p, '結婚了', `你和${pt.name}結婚了，支出 ${money(cost)}${help ? `，長輩資助了 ${money(help)}` : ''}。${pt.homemaker ? `${pt.name}成為全職家庭照顧者。` : `家庭多了一份年收入 ${money(pt.income)}。`}<br><small>婚姻會同時改變收入和支出結構，記得重新檢視現金流。</small>`, `${p.name} 和${pt.name}結婚了`);
}

  if (!pool.length) return;
  const seen = p.relSeen || (p.relSeen = []);
  const c = wpick(pool.map(x => ({ x, w: (x.w || 1) * (seen.includes(REL_EVENTS.indexOf(x)) ? 0.12 : 1) }))).x;
  seen.unshift(REL_EVENTS.indexOf(c)); if (seen.length > 5) seen.pop();
  const res = await c.run(p);
  if (res) await tell(p, `感情｜${res[0]}`, res[1], `${p.name}：${res[0]}`);
}

async function settleRomance(p) {
  const pt = p.partner; if (!pt) return;
  let d = (-11 - TRAITS[pt.trait].decay + (pt.homemaker ? 5 : 0) + (pt.living ? 2 : 0) + (compat(p, pt) - 1) * 2) / 2;
  if (p.plan === 'overtime') d -= 2.5;
  if (p.biz.length) d -= p.biz.length;
  if (p.health < 40) d -= 1;
  if (p.credit > 0) d -= 1.5;
  pt.rel = clamp(Math.min(pt.rel + d, STAGES[pt.stage].cap), 0, 100);
  // 好感度到門檻後，要再走一段路才會觸發下一階段的里程碑
  const st = STAGES[pt.stage];
  if (!pt.pending && st.next != null && pt.rel >= st.next) { pt.pending = true; pt.steps = 0;
    if (p.isHuman) IO.log(`你和${pt.name}的關係到了一個轉折點，再走幾步就會有進展`, 'hint'); }
  if (pt.rel < 18 && R() < 0.35) {
    if (!p.married) {
      const nm = pt.name; p.partner = null; p.coolDownLove = 2; p.health = clamp(p.health - 8, 0, 100);
      await tell(p, '分手了', `你和${nm}的感情走到了盡頭。健康 -8。<br><small>關係就像資產，需要持續投入才不會貶值。</small>`, `${p.name} 和${nm}分手了`);
    } else await divorce(p);
  }
}

// 走了一段路之後觸發的階段里程碑
async function milestoneEvent(p) {
  const pt = p.partner; pt.pending = false; pt.steps = 0;
  const infl = G.market.infl;
  if (pt.stage === 0) {
    const c = 6 * WAN * infl * VALUES[pt.values].dateMul;
    const v = await ask(p, { title: `要對${pt.name}告白嗎？`, body: `你們相處得不錯（好感度 ${Math.round(pt.rel)}），是時候把話講開了。<br>用心準備的告白約 ${money(c)}。`,
      options: [{ label: `精心安排告白（${money(c)}）`, value: 2, disabled: p.cash < c, hint: '成功率高，好感度 +10' },
        { label: '直接開口說', value: 1, hint: '不花錢，成功率較低' },
        { label: '再等等', value: 0 }], ai: pp => (pp.cash > c * 5 ? 2 : 1) });
    if (!v) return;
    if (v === 2) p.cash -= c;
    const ok = R() < (v === 2 ? 0.88 : 0.6) + (pt.rel - 50) / 200;
    if (ok) {
      pt.stage = 1; pt.rel = Math.min(STAGES[1].cap, pt.rel + (v === 2 ? 10 : 5));
      await tell(p, '在一起了', `${pt.name}答應了！你們正式成為情侶，進入「穩定交往」階段，好感度上限提高到 ${STAGES[1].cap}，也解鎖了更進階的約會行程。`, `${p.name} 和${pt.name}正式交往`);
    } else {
      pt.rel = clamp(pt.rel - 8, 0, 100);
      await tell(p, '被婉拒了', `${pt.name}說想再多了解一點。氣氛有點尷尬，好感度 -8。<br><small>再累積一些好感度，之後還有機會。</small>`, `${p.name} 告白被婉拒`);
    }
    return;
  }
  if (pt.stage === 1) {
    const c = 25 * WAN * infl;
    const v = await ask(p, { title: '關係要更進一步了', body: `你們的感情很穩定（好感度 ${Math.round(pt.rel)}）。<br>可以見雙方家長、或是搬到一起住（搬家與布置約 ${money(c)}）。`,
      options: [{ label: `同居（${money(c)}）`, value: 'live', disabled: p.cash < c, hint: '好感度 +12，之後每半年多 +1' },
        { label: '先見雙方家長', value: 'family', hint: '好感度 +8、人脈 +3' },
        { label: '維持現狀', value: 0 }], ai: pp => (pp.cash > c * 4 ? 'live' : 'family') });
    if (!v) return;
    if (v === 'live') { p.cash -= c; pt.living = true; pt.rel = Math.min(100, pt.rel + 12); }
    else { pt.rel = Math.min(100, pt.rel + 8); p.net = clamp(p.net + 3, 0, 100); }
    pt.stage = 2;
    await tell(p, v === 'live' ? '開始同居' : '見過雙方家長', `你們進入「論及婚嫁」階段，好感度上限解除，也可以求婚了。`, `${p.name} 和${pt.name}的關係更進一步`);
  }
}

async function divorce(p) {
  const pt = p.partner, h = holdings(p);
  const rate = (p.prenup ? 0.18 : 0.35) + R() * 0.12;
  const split = Math.max(0, h.net) * rate;
  const fromCash = Math.min(Math.max(p.cash, 0), split);
  p.cash -= fromCash;
  const rest = split - fromCash;
  if (rest > 0) p.credit += rest;
  p.alimony = p.kids.length ? p.kids.length * 14 * WAN * G.market.infl : 0;
  const nm = pt.name;
  p.partner = null; p.married = false; p.spouseIncome = 0; p.health = clamp(p.health - 12, 0, 100);
  p.divorces = (p.divorces || 0) + 1; p.coolDownLove = 4; p.noMoreKids = false;
  await tell(p, '離婚了', `你和${nm}結束了婚姻。財產分割 ${money(split)}${p.prenup ? '（婚前協議讓分割比例降低）' : ''}${rest > 0 ? `，現金不足的 ${money(rest)} 只能借款支付` : ''}，健康 -12。${p.alimony ? `<br>之後每年還要支付子女扶養費 ${money(p.alimony)}。` : ''}<br><small>離婚在財務上的衝擊，往往比任何一次投資失利都大。</small>`, `${p.name} 離婚了`);
}

async function kidsGrowUp(p) {
  for (const k of p.kids.slice()) {
    k.age++;
    if (k.age >= 22) {
      p.kids.splice(p.kids.indexOf(k), 1);
      const out = EDU_PLANS[k.plan].out * (0.75 + R() * 0.5);
      if (out > 1.15) {
        const v = 10 * WAN * G.market.infl; p.cash += v; p.net = clamp(p.net + 4, 0, 100);
        await tell(p, '孩子出社會了', `孩子順利就業，第一份薪水就包了 ${money(v)} 的紅包給你。人脈 +4。`, `${p.name} 的孩子出社會了`);
      } else if (out < 0.85) {
        const v = 25 * WAN * G.market.infl; p.cash -= v;
        await tell(p, '孩子還在摸索', `孩子畢業後一時找不到方向，這一年的生活費 ${money(v)} 還是你在支應。<br><small>教育花得多，不保證結果。</small>`, `${p.name} 的孩子還在摸索`);
      } else await tell(p, '孩子獨立了', '孩子開始自己生活，養育支出告一段落。', `${p.name} 的孩子獨立了`);
    }
  }
}

function qualityOfLife(p) {
  const rel = p.partner ? p.partner.rel : 0;
  const fam = (p.married ? 22 : p.partner ? 12 : 0) + Math.min(18, (p.kidsBorn || 0) * 7) + rel * 0.2;
  const life = { frugal: 5, normal: 10, enjoy: 15 }[p.lifestyle];
  return Math.round(clamp(p.health * 0.38 + fam + life + Math.min(22, prestige(p) * 0.5) + (p.retired ? 4 : 0), 0, 100));
}
function familyLabel(p) {
  const kidTxt = (p.kidsBorn || 0) ? `，${p.kidsBorn} 個孩子` : '';
  if (p.married && p.partner) return `已婚（${p.partner.name}，${relLabel(p.partner.rel)}）${kidTxt}`;
  if (p.partner) return `交往中（${p.partner.name}，${relLabel(p.partner.rel)}）${kidTxt}`;
  return (p.divorces ? '離婚' : '單身') + kidTxt;
}

function buyDream(p, id) {
  const D = DREAM[id];
  if (!D) return { ok: false, msg: '找不到這個項目' };
  if ((p.dreams || []).some(x => x.id === id)) return { ok: false, msg: '你已經擁有了' };
  const cost = D.cost * WAN * G.market.infl;
  if (p.cash < cost) return { ok: false, msg: `現金不足，需要 ${money(cost)}` };
  p.cash -= cost; p.dreams.push({ id, value: D.once ? 0 : cost });
  if (D.net) p.net = clamp(p.net + D.net, 0, 100);
  IO.log(`${p.name} 實現了夢想：${D.name}`, 'good');
  return { ok: true, msg: `${D.name}入手，花了 ${money(cost)}。每年維護 ${money(D.upkeep * WAN * G.market.infl)}${D.net ? `，人脈 +${D.net}` : ''}。` };
}
function sellDream(p, i) {
  const it = p.dreams[i]; if (!it) return { ok: false, msg: '找不到這個項目' };
  const D = DREAM[it.id];
  if (D.keep) return { ok: false, msg: `${D.name}無法變賣` };
  const get = it.value * 0.88;
  p.cash += get; p.dreams.splice(i, 1);
  IO.log(`${p.name} 賣掉了${D.name}`, p.isHuman ? 'me' : '');
  return { ok: true, msg: `賣出${D.name}，拿回 ${money(get)}（交易成本 ${money(it.value - get)}）` };
}
function ageDreams(p) {
  const gold = G.market.ret.GOLD || 0, prop = G.market.propRet || 0;
  (p.dreams || []).forEach(it => {
    const D = DREAM[it.id];
    if (D.once) return;
    if (D.art) it.value *= 1 + 0.01 + gold * 0.4 + gauss() * 0.09;
    else if (D.prop) it.value *= 1 + prop + gauss() * 0.01;
    else if (D.depr) it.value *= 1 - D.depr;
    else it.value *= 1 + (D.grow || 0) + gauss() * 0.02;
    it.value = Math.max(D.cost * WAN * 0.1, it.value);
  });
}

const IND = Object.fromEntries(INDUSTRIES.map(x => [x.id, x]));
// 價格彈性：同樣漲價，一般商品客人跑得快，特色商品影響小
const priceVol = (I, k) => Math.max(0.2, 1 + PRICING[k].dv * (I.elas || 1));

// 商圈：對應棋盤上的房產格
const DISTRICTS = {
  1: { name: '大學城', foot: 1.15, rent: 78, afford: 'low' },
  4: { name: '夜市商圈', foot: 1.75, rent: 145, afford: 'low' },
  7: { name: '捷運站前', foot: 1.5, rent: 132, afford: 'mid' },
  11: { name: '老街', foot: 0.8, rent: 40, afford: 'mid' },
  14: { name: '科學園區', foot: 1.15, rent: 100, afford: 'high' },
  17: { name: '海邊小鎮', foot: 0.7, rent: 32, afford: 'high' },
  21: { name: '市中心商圈', foot: 1.95, rent: 215, afford: 'high' },
};
// vol 來客數倍數、tk 售價倍數。成本隨「賣出的數量」走，所以降價會壓縮每筆的利潤
const PRICING = {
  low: { name: '平價走量', dv: 0.35, tk: 0.85, tone: 'low', desc: '客人變多、但每筆賺得少，也需要更多人力' },
  mid: { name: '一般行情', dv: 0, tk: 1, tone: 'mid', desc: '中規中矩' },
  high: { name: '精緻高價', dv: -0.3, tk: 1.3, tone: 'high', desc: '每筆賺得多、人力需求低，但客人變少' },
};
const STAFF_COST = 42 * WAN; // 每名員工年薪（含勞健保）
const MANAGER_COST = 78 * WAN; // 店長年薪：請了店長，你才真的不用自己顧店
const PASSIVE_SHARE = 0.55; // 沒請店長時，利潤只有這個比例算被動收入，其餘算你自己的勞務所得

const staffNeeded = (I, price, shops) => Math.max(1, Math.round(I.staffNeed * shops * priceVol(I, price)));
// 老闆沒有在外面上班、也沒請店長時，自己就是一個人力
const ownerWorks = (p, b) => (p.status !== 'employed' && !b.manager ? 1 : 0);
const effStaff = (p, b) => b.staff + ownerWorks(p, b);
const shopRent = (d, p) => (d == null || (p && G.owner[d] === p.id) ? 0 : DISTRICTS[d].rent * WAN * G.market.infl);
const bizName = b => IND[b.type].name;
function bizRevenue(p, b) { const I = IND[b.type]; return b.shops.reduce((s, sh) => s + shopCustomers(p, b, sh), 0) * I.ticket * PRICING[b.price].tk * G.market.infl; }
const allBiz = () => G.players.flatMap(p => p.biz.map(b => ({ p, b })));
// 同商圈同類型的競爭者數量
function competitors(district, cat, self) {
  let n = 0;
  allBiz().forEach(({ b }) => { if (b !== self && IND[b.type].cat === cat) n += b.shops.filter(s => s.d === district).length; });
  return n;
}
function toneMatch(afford, tone) {
  if (!afford) return 1;
  if (afford === tone) return 1.12;
  if ((afford === 'low' && tone === 'high') || (afford === 'high' && tone === 'low')) return 0.8;
  return 1;
}

// 一間店的來客數
function shopCustomers(p, b, shop) {
  const I = IND[b.type], pr = PRICING[b.price], d = shop.d;
  const dist = d == null ? null : DISTRICTS[d];
  const foot = dist ? 1 + (dist.foot - 1) * I.foot : 1, pv = priceVol(I, b.price);
  const comp = competitors(d, I.cat, b);
  const share = 1 / (1 + (d == null ? 0.35 : 0.45) * comp);
  const skill = clamp(1 + (netEff(p) - 30) / 165 + (p.edu - 30) / 500, 0.72, 1.6);
  const brand = 1 + b.brand / 100;
  const staffRatio = clamp(effStaff(p, b) / (I.staffNeed * b.shops.length * pv), 0.45, 1.3);
  const cap = staffRatio > 1 ? 1 + (staffRatio - 1) * 0.25 : staffRatio;
  const mod = 1 + (G.market.bizMod[I.sector] || 0);
  const face = pr.tone === 'high' ? 0.88 + appearance(p) / 420 : 1;
  const guanxi = I.id === 'club' ? clamp(netEff(p) / 68, 0.3, 1.35) : 1;
  return I.base * foot * pv * share * skill * brand * cap * mod * face * guanxi * toneMatch(dist && dist.afford, pr.tone);
}
function bizExpectedProfit(p, b, noise) {
  const I = IND[b.type], pr = PRICING[b.price], infl = G.market.infl;
  const price = I.ticket * pr.tk * infl, unitCost = I.ticket * (1 - I.margin) * infl;
  let cust = 0, rent = 0;
  b.shops.forEach(s => { cust += shopCustomers(p, b, s); rent += shopRent(s.d, p); });
  const rev = cust * price, gross = cust * (price - unitCost);
  const staffCost = (b.staff * STAFF_COST + (b.manager ? MANAGER_COST : 0)) * infl;
  const overhead = rev * (I.online ? 0.05 : 0.1);
  const fixed = I.cost * WAN * infl * 0.12 * b.shops.length;
  let profit = gross - staffCost - rent - overhead - fixed;
  if (p.status === 'employed') profit *= 0.65; // 還在上班，兼顧經營
  if (noise) profit += rev * I.margin * gauss() * I.vol * 0.5;
  return Math.round(profit);
}
const bizExpected = (p, b) => bizExpectedProfit(p, b, false);
function bizValue(b) { return Math.round(b.cost * 0.4 + Math.max(0, b.lastProfit || 0) * 2.5 + b.brand * WAN * 0.4); }
function bizSummary(p, b) {
  const I = IND[b.type];
  return `${b.shops.map(s => (s.d == null ? '線上' : DISTRICTS[s.d].name)).join('、')}　${PRICING[b.price].name}　員工 ${b.staff} 人${ownerWorks(p, b) ? '＋你自己' : ''}　品牌 ${Math.round(b.brand)}`;
}

// 評估某行業在各商圈、各定價下最好的組合（電腦玩家用）
function bestPlan(p, I, fixedD) {
  const ds = I.online ? [null] : (fixedD != null ? [fixedD] : Object.keys(DISTRICTS).map(Number));
  let best = null;
  for (const d of ds) for (const price of ['low', 'mid', 'high']) {
    const staff = staffNeeded(I, price, 1);
    const tmp = { type: I.id, shops: [{ d }], price, staff, brand: 0, cost: I.cost * WAN * G.market.infl };
    const profit = bizExpectedProfit(p, tmp, false);
    if (!best || profit > best.profit) best = { d, price, staff, profit };
  }
  return best;
}
function aiPickIndustry(p, affordable) {
  const P = PERSONAS[p.persona];
  const scored = affordable.map(I => { const bp = bestPlan(p, I); return { I, bp, roi: bp.profit / (I.cost * WAN * G.market.infl) }; })
    .filter(x => x.bp.profit > 0);
  if (!scored.length) return null;
  scored.forEach(x => { x.w = Math.max(0.01, x.roi) * (p.persona === 'gambler' ? 1 + (x.I.vol || 0) : 1 / (1 + (x.I.vol || 0))); });
  return wpick(scored.map(x => ({ ...x, w: x.w }))).I.id;
}

// ---------- 開業流程 ----------
async function openBusinessFlow(p) {
  const infl = G.market.infl;
  const opts = INDUSTRIES.map(I => {
    const cost = I.cost * WAN * infl, owned = p.biz.some(x => x.type === I.id);
    const ok = !owned && p.cash >= cost * (p.bizDiscount ? 0.85 : 1) && p.edu >= I.edu && netEff(p) >= I.net;
    return { label: `${I.name}　開辦 ${money(cost * (p.bizDiscount ? 0.85 : 1))}`, value: I.id, disabled: !ok,
      hint: owned ? '你已經在經營了' : ok ? I.desc : `需要現金 ${money(cost)}${I.edu ? `、學識 ${I.edu}` : ''}、人脈 ${I.net}` };
  });
  opts.push({ label: '先不創業', value: null });
  const type = await ask(p, { title: '選擇行業', body: `事業利潤算進被動收入，是達成財富自由的重要來源，但經營得看地點、定價和人力，也可能虧損倒閉。${p.bizDiscount ? '<br><b>停在創業中心：開辦成本打 85 折。</b>' : ''}${p.status === 'employed' ? '<br><small>你還在上班，只能兼顧經營，利潤打 65 折。</small>' : ''}`,
    options: opts, ai: pp => {
      const P = PERSONAS[pp.persona]; if (!pp.aiWantsBiz && R() > P.biz) return null;
      const rec = cashflow(pp).rec;
      const cand = opts.filter(o => !o.disabled && o.value && pp.cash - IND[o.value].cost * WAN * infl > rec * P.reserve * 0.5).map(o => IND[o.value]);
      return cand.length ? aiPickIndustry(pp, cand) : null;
    } });
  if (!type) return;
  const I = IND[type];

  let d = null;
  if (!I.online) {
    const dopts = Object.entries(DISTRICTS).map(([k, dd]) => {
      const idx = +k, mine = G.owner[idx] === p.id, comp = competitors(idx, I.cat, null);
      return { label: `${dd.name}`, value: idx,
        hint: `人流 ${'●'.repeat(Math.round(dd.foot * 3))}　年租金 ${mine ? '自有物業，免租金' : money(shopRent(idx, p))}　客層${{ low: '平價', mid: '一般', high: '高消費' }[dd.afford]}${comp ? `　已有 ${comp} 家同類型競爭` : '　目前沒有同業'}` };
    });
    d = await ask(p, { title: `${I.name}：選擇地點`, body: '人流越高、租金越貴。同一個商圈已經有同類型的店，客源會被分走。自己名下的房產可以當店面，省下租金。',
      options: dopts, ai: pp => bestPlan(pp, I).d });
    if (d == null) return;
  }
  const price = await ask(p, { title: `${I.name}：定價策略`, body: `這一區的客層是${d == null ? '網路客群' : { low: '平價取向', mid: '一般', high: '高消費力' }[DISTRICTS[d].afford]}。定價要和客層搭配，不然客人不會上門。`,
    options: Object.entries(PRICING).map(([k, pr]) => ({ label: pr.name, value: k, hint: `${pr.desc}　客單價約 ${money(I.ticket * pr.tk * infl)}` })),
    ai: pp => bestPlan(pp, I, d).price });
  const need = staffNeeded(I, price, 1);
  const staff = await ask(p, { title: `${I.name}：請幾個員工`, body: `以${PRICING[price].name}的來客量，建議 ${need} 人。人太少接待不完客人，人太多則是白付薪水。每人年薪約 ${money(STAFF_COST * infl)}。`,
    options: [need - 1, need, need + 1].filter(x => x >= 1).map(n => ({ label: `${n} 人`, value: n, hint: n < need ? '省人事費，但客人會流失' : n === need ? '剛好夠用' : '服務較好，可以多接一些客人' })),
    ai: pp => staffNeeded(I, price, 1) });
  const cost = I.cost * WAN * infl * (p.bizDiscount ? 0.85 : 1);
  p.cash -= cost;
  p.biz.push({ type, shops: [{ d }], price, staff, manager: false, brand: 0, cost, lastProfit: null, lossYears: 0, goodYears: 0, age: 0 });
  IO.log(`${p.name} 開了一家${I.name}${d == null ? '' : `（${DISTRICTS[d].name}）`}`, 'good');
  await tell(p, '開業了', `${I.name}正式開幕，投入 ${money(cost)}。<br>預估第一年利潤約 ${money(bizExpected(p, p.biz[p.biz.length - 1]))}。<br><small>經營需要時間累積品牌，前幾年通常比較辛苦。</small>`, null);
}

  if (!p.biz.length) return openBusinessFlow(p);

  list.push({ label: '開一個新事業', value: 'new' });

    if (nd != null) { p.cash -= branchCost; b.shops.push({ d: nd }); b.staff = staffNeeded(I, b.price, b.shops.length); b.cost += branchCost;
      await tell(p, '分店開幕', `在${DISTRICTS[nd].name}的分店開幕，員工增加到 ${b.staff} 人。<br>預估今年利潤 ${money(bizExpected(p, b))}。`, `${p.name} 在${DISTRICTS[nd].name}開了分店`); }

}

// ---------- 年度結算與關鍵時刻 ----------
async function settleBusinesses(p) {
  const out = [];
  for (const b of p.biz.slice()) {
    const profit = bizExpectedProfit(p, b, true);
    out.push(profit); b.lastProfit = profit; b.age++;
    b.lossYears = profit < 0 ? b.lossYears + 1 : 0;
    b.goodYears = profit > b.cost * 0.18 ? b.goodYears + 1 : 0;
    b.brand = clamp(b.brand + (profit > 0 ? (b.price === 'low' ? 4 : b.price === 'high' ? 2 : 3) : -4), 0, 100);
    const I = IND[b.type];
    if (b.lossYears >= 2) {
      const need = Math.round(-profit * 1.2);
      const v = await ask(p, { title: `${bizName(b)}：連續虧損`, body: `已經連續虧損 ${b.lossYears} 年，去年虧 ${money(-profit)}。再撐下去需要補資金，或是壯士斷腕。`,
        options: [{ label: `增資撐下去（${money(need)}）`, value: 'fund', disabled: p.cash < need, hint: '同時降價衝人氣' },
          { label: '縮編人力止血', value: 'cut', disabled: b.staff <= 1, hint: '省人事費，但服務會變差' },
          { label: `收掉，拿回 ${money(b.cost * 0.2)}`, value: 'close' }],
        ai: pp => (pp.cash > need * 3 && R() < 0.4 ? 'fund' : b.staff > 1 && R() < 0.5 ? 'cut' : 'close') });
      if (v === 'fund') { p.cash -= need; b.price = 'low'; b.staff = staffNeeded(I, 'low', b.shops.length); b.brand = Math.min(100, b.brand + 5); }
      else if (v === 'cut') { b.staff = Math.max(1, b.staff - 1); }
      else {
        const rec = b.cost * 0.2; p.cash += rec; p.biz.splice(p.biz.indexOf(b), 1); out[out.length - 1] = profit;
        await tell(p, '事業收掉了', `${bizName(b)}結束營業，處分設備拿回 ${money(rec)}。<br><small>設好停損點，比硬撐到把積蓄賠光更重要。</small>`, `${p.name} 的${bizName(b)}收攤了`);
        continue;
      }
    }
    if (b.goodYears >= 2 && !I.online && b.shops.length < 4 && R() < 0.8) {
      const cost = I.cost * WAN * G.market.infl * 0.8;
      const used = b.shops.map(s => s.d), free = Object.keys(DISTRICTS).map(Number).filter(k => !used.includes(k));
      if (free.length && p.cash >= cost) {
        const target = free.map(d => ({ d, s: bizExpectedProfit(p, { type: b.type, shops: [{ d }], price: b.price, staff: staffNeeded(I, b.price, 1), brand: b.brand, cost: b.cost }, false) })).sort((x, y) => y.s - x.s)[0].d;
        const v = await ask(p, { title: `${bizName(b)}：擴張機會`, body: `連續兩年獲利不錯，房仲介紹${DISTRICTS[target].name}的店面，開分店要 ${money(cost)}（年租金 ${money(shopRent(target, p))}）。`,
          options: [{ label: '開分店', value: 1, hint: '規模變大，固定成本也變高' }, { label: '維持現狀，先把現金留著', value: 0 }],
          ai: pp => (pp.cash > cost * 2 && bizExpectedProfit(pp, { type: b.type, shops: [{ d: target }], price: b.price, staff: staffNeeded(I, b.price, 1), brand: b.brand, cost: b.cost }, false) > cost * 0.15 ? 1 : 0) });
        if (v) { p.cash -= cost; b.shops.push({ d: target }); b.staff = staffNeeded(I, b.price, b.shops.length); b.cost += cost; b.goodYears = 0;
          IO.log(`${p.name} 的${bizName(b)}在${DISTRICTS[target].name}開分店`, 'good'); }
      }
    }
    if (b.age >= 3 && profit > b.cost * 0.25 && R() < 0.18) {
      const offer = Math.round(b.cost * 0.6 + profit * (4 + R() * 4));
      const v = await ask(p, { title: `${bizName(b)}：收購提案`, body: `有集團想買下你的${bizName(b)}，開價 ${money(offer)}（目前每年獲利 ${money(profit)}）。賣掉就少了這份被動收入，但可以一次拿到一大筆錢。`,
        options: [{ label: `賣掉，拿 ${money(offer)}`, value: 1, hint: `大約等於 ${(offer / profit).toFixed(1)} 年的利潤` }, { label: '不賣，繼續自己經營', value: 0 }],
        ai: () => (offer > profit * 6 ? 1 : 0) });
      if (v) { p.cash += offer; p.biz.splice(p.biz.indexOf(b), 1);
        await tell(p, '事業被收購', `你以 ${money(offer)} 賣掉了${bizName(b)}。<br><small>賣掉會生錢的資產前，先算清楚這筆錢能不能創造同樣的現金流。</small>`, `${p.name} 賣掉了${bizName(b)}`);
        continue; }
    }
  }
  return out;
}

// 電腦玩家自行評估要不要創業
async function aiBusinessStep(p) {
  const P = PERSONAS[p.persona];
  for (const b of p.biz) if (!b.manager && (b.lastProfit || 0) > MANAGER_COST * G.market.infl * 2.2) b.manager = true;
  if (p.status === 'student' || p.biz.length >= 2) return;
  if (R() > P.biz * 1.3) return;
  const cf = cashflow(p), reserve = Math.max(cf.totE, 10 * WAN) * P.reserve * 0.7;
  const afford = INDUSTRIES.some(I => p.edu >= I.edu && p.net >= I.net && p.cash - I.cost * WAN * G.market.infl > reserve);
  if (!afford) return;
  p.aiWantsBiz = true; await openBusinessFlow(p); p.aiWantsBiz = false;
}

// ================= 市場模擬（逐月 K 線） =================
const ASSETS = ['TECH', 'FOOD', 'ENGY', 'BANK', 'ETF', 'IDX', 'GOLD', 'USD', 'JPY', 'EUR'];
function assetName(id) { return STOCK_MAP[id] ? STOCK_MAP[id].name : id === 'IDX' ? '加權指數' : id === 'GOLD' ? '黃金' : `${CURRENCIES[id].name}兌台幣`; }
function assetPrice(id) { const m = G.market; if (STOCK_MAP[id]) return m.prices[id]; if (id === 'IDX') return m.index; if (id === 'GOLD') return m.gold; return m.fx[id]; }
function setAssetPrice(id, v) { const m = G.market; if (STOCK_MAP[id]) m.prices[id] = Math.max(1, round2(v)); else if (id === 'IDX') m.index = v; else if (id === 'GOLD') m.gold = v; else m.fx[id] = v; }
function assetVol(id) { if (STOCK_MAP[id]) return id === 'ETF' ? 0.14 : STOCK_MAP[id].vol + 0.08; if (id === 'IDX') return 0.14; if (id === 'GOLD') return 0.14; return CURRENCIES[id].vol + 0.02; }

// 事件影響 E 在一年 12 個月中的分配方式
function evPart(E, k, shape, em) {
  if (!E) return 0;
  const rest = 11 - em;
  if (shape === 'gradual') return k >= em ? E / (12 - em) : 0;
  if (shape === 'overshoot') { if (k === em) return rest ? 1.4 * E : E; return k > em ? -0.4 * E / rest : 0; }
  if (k === em) return rest ? 0.65 * E : E;
  return k > em ? 0.35 * E / rest : 0;
}

function drawCompanyNews() {
  const out = [];
  Object.entries(COMPANY_NEWS).forEach(([stock, list]) => {
    if (R() < 0.35) { const [text, eff] = list[Math.floor(R() * list.length)]; out.push({ stock, text, eff, month: Math.floor(R() * 12) }); }
  });
  return out;
}

function planYear(ev, comp, year) {
  const shape = ev.shape || 'shock';
  const em = shape === 'gradual' ? Math.floor(R() * 4) : 2 + Math.floor(R() * 7);
  const r = {}; ASSETS.forEach(a => r[a] = []);
  const sq = Math.sqrt(12);
  for (let k = 0; k < 12; k++) {
    const mk = gauss() * 0.06 / sq + evPart(ev.idx || 0, k, shape, em);
    r.IDX[k] = 0.04 / 12 + mk;
    STOCKS.forEach(s => {
      if (s.id === 'ETF') { r.ETF[k] = r.IDX[k] + gauss() * 0.004 / sq; return; }
      let v = 0.03 / 12 + s.beta * mk + evPart((ev.sec || {})[s.sector] || 0, k, shape, em) + gauss() * s.vol / sq;
      comp.forEach(c => { if (c.stock === s.id) v += evPart(c.eff, k, 'shock', c.month); });
      r[s.id][k] = v;
    });
    r.GOLD[k] = 0.03 / 12 + evPart(ev.gold || 0, k, shape, em) + gauss() * 0.1 / sq;
    Object.keys(CURRENCIES).forEach(c => { r[c][k] = evPart(ev[c.toLowerCase()] || 0, k, shape, em) + gauss() * CURRENCIES[c].vol / sq; });
  }
  ASSETS.forEach(a => { r[a] = r[a].map(x => Math.max(x, -0.45)); });
  return { ev, em, r, year, shape };
}

// 產生第 from 到 to 月的 K 棒，並更新價格
function applyMonths(plan, from, to) {
  const m = G.market, N = 16;
  for (let k = from; k <= to; k++) {
    for (const a of ASSETS) {
      const o = assetPrice(a), c = Math.max(o * 0.05, o * (1 + plan.r[a][k]));
      const s = assetVol(a) / Math.sqrt(12 * N), drift = Math.log(c / o);
      const ws = [0]; let W = 0; for (let i = 1; i <= N; i++) { W += gauss(); ws.push(W); }
      let hi = Math.max(o, c), lo = Math.min(o, c);
      for (let i = 1; i < N; i++) { const v = o * Math.exp(drift * i / N + (ws[i] - ws[N] * i / N) * s); if (v > hi) hi = v; if (v < lo) lo = v; }
      m.series[a].push({ y: plan.year, mo: k, o, h: hi, l: lo, c });
      setAssetPrice(a, c);
    }
    if (k === plan.em) { m.prevRate = m.rate; m.rate = clamp(m.rate + (plan.ev.rate || 0) + gauss() * 0.001, 0.0025, 0.06); }
  }
}

function addMarks(plan, comp) {
  const m = G.market;
  const ev = plan.ev, ids = [], idx = Math.abs(ev.idx || 0);
  if (idx >= 0.05) ids.push('IDX', 'ETF');
  STOCKS.forEach(s => { if (s.id !== 'ETF' && (Math.abs((ev.sec || {})[s.sector] || 0) >= 0.08 || idx >= 0.15)) ids.push(s.id); });
  if (Math.abs(ev.gold || 0) >= 0.05) ids.push('GOLD');
  Object.keys(CURRENCIES).forEach(c => { if (Math.abs(ev[c.toLowerCase()] || 0) >= 0.04) ids.push(c); });
  if (ids.length) m.marks.push({ y: plan.year, mo: plan.em, text: ev.name, ids, macro: true });
  comp.forEach(c => m.marks.push({ y: plan.year, mo: c.month, text: `${STOCK_MAP[c.stock].name}：${c.text}`, ids: [c.stock], up: c.eff > 0 }));
}

// 開局前先模擬 3 年歷史，讓 K 線圖一開始就有資料
function backfillHistory() {
  const m = G.market, init = {}, rate0 = m.rate;
  ASSETS.forEach(a => init[a] = assetPrice(a));
  const pool = EVENTS.filter(e => e.w > 0 && !(e.idx < -0.2));
  for (let y = -2; y <= 0; y++) {
    const ev = wpick(pool), comp = drawCompanyNews(), plan = planYear(ev, comp, y);
    applyMonths(plan, 0, 11); addMarks(plan, comp);
  }
  ASSETS.forEach(a => {
    const f = init[a] / assetPrice(a);
    m.series[a].forEach(cd => { cd.o *= f; cd.h *= f; cd.l *= f; cd.c *= f; });
    setAssetPrice(a, init[a]);
  });
  m.rate = m.prevRate = rate0;
}

function setYearReturns() { const m = G.market; ASSETS.forEach(a => { m.ret[a] = assetPrice(a) / m.yearOpen[a] - 1; }); }

// 市場造成的資產變化
function markValue(p) {
  const m = G.market, st = {};
  STOCKS.forEach(s => st[s.id] = (p.stocks[s.id] || 0) * m.prices[s.id]);
  return { st, bonds: p.bonds.reduce((s, l) => s + bondUnitPrice(l) * l.units, 0), fx: Object.keys(p.fx).reduce((s, c) => s + p.fx[c] * m.fx[c], 0), props: p.props.reduce((s, x) => s + x.value, 0) };
}
function addDiff(acc, a, b) { STOCKS.forEach(s => acc.st[s.id] += b.st[s.id] - a.st[s.id]); acc.bonds += b.bonds - a.bonds; acc.fx += b.fx - a.fx; acc.props += b.props - a.props; }

function makeForecast() {
  const truth = G.market.next, pTrue = [0.55, 0.45, 0.35][Math.floor(R() * 3)];
  const others = shuffle(EVENTS.filter(e => e.w > 0 && e.id !== truth.id)).slice(0, 2), rem = 1 - pTrue;
  const r5 = x => Math.round(x * 20) / 20;
  return [{ ev: truth, prob: r5(pTrue) }, { ev: others[0], prob: r5(rem * 0.6) }, { ev: others[1], prob: r5(rem * 0.4) }].sort((a, b) => b.prob - a.prob);
}

// 年中事件爆發時的抉擇
async function reactTo(p, ev, plan, acc) {
  const m = G.market, mo = plan.em + 1, kind = ev.react;
  const stockVal = STOCKS.reduce((s, x) => s + p.stocks[x.id] * m.prices[x.id], 0);
  const paper = STOCKS.reduce((s, x) => s + acc.st[x.id], 0), idxChg = m.index / m.yearOpen.IDX - 1;
  const chart = p.isHuman && IO.chart ? IO.chart('IDX', { mode: 'month', range: 24, h: 180 }) : '';
  const idxLine = `加權指數今年到目前 <b class="${idxChg >= 0 ? 'up' : 'down'}">${pct(idxChg)}</b>。`;
  const paperLine = stockVal >= WAN ? `你的股票這段期間帳面${paper >= 0 ? '增加' : '蒸發'} <b class="${paper >= 0 ? 'up' : 'down'}">${money(Math.abs(paper))}</b>。` : '';
  let opts, body, half = p.cash * 0.5;
  if (kind === 'dip') {
    if (stockVal < WAN && p.cash < 5 * WAN) return;
    body = `${chart}<p>${idxLine}${paperLine}新聞一片悲觀，你要怎麼做？</p>`;
    opts = [
      { label: '恐慌賣出：出清所有股票', value: 'sell', disabled: stockVal < WAN, hint: stockVal >= WAN ? `用現在的價格賣掉，約拿回 ${money(stockVal * 0.994)}` : '你沒有持股' },
      { label: '逢低加碼：拿一半現金買指數 ETF', value: 'buy', disabled: half < WAN, hint: `投入約 ${money(half)}` },
      { label: '按兵不動', value: 'hold', hint: '不做任何交易，等市場自己走' },
    ];
  } else if (kind === 'bubble') {
    if (stockVal < WAN && p.cash < 5 * WAN) return;
    body = `${chart}<p>${idxLine}${paperLine}身邊的人都在說還會再漲，你要怎麼做？</p>`;
    opts = [
      { label: '趁熱追高：拿一半現金買科技股', value: 'chase', disabled: half < WAN, hint: `投入約 ${money(half)}` },
      { label: '獲利了結：賣出一半持股', value: 'take', disabled: stockVal < WAN, hint: stockVal >= WAN ? `約拿回 ${money(stockVal * 0.5)}` : '你沒有持股' },
      { label: '按兵不動', value: 'hold', hint: '不做任何交易' },
    ];
  } else if (kind === 'crypto') {
    if (p.cash < 5 * WAN) return;
    const small = p.cash * 0.1, big = p.cash * 0.4;
    body = '<p>身邊越來越多人在買虛擬貨幣，價格一個月內翻倍，網路上到處是一夜致富的故事。要不要跟上？結果一年後揭曉。</p>';
    opts = [
      { label: `小試身手：投入 ${money(small)}`, value: 'small', hint: '現金的一成' },
      { label: `重壓：投入 ${money(big)}`, value: 'big', hint: '現金的四成' },
      { label: '不碰虛擬貨幣', value: 'no' },
    ];
    const v = await ask(p, { title: `${mo} 月：${ev.name}`, body, options: opts, ai: pp => { const a = PERSONAS[pp.persona].react.crypto; return a[Math.floor(R() * a.length)]; } });
    if (v === 'small' || v === 'big') { const amt = v === 'small' ? small : big; p.cash -= amt; addPending(p, 'crypto', 2, { amt }); IO.log(`${p.name} 投入 ${money(amt)} 買虛擬貨幣`, p.isHuman ? 'me' : ''); }
    return;
  } else return;
  const v = await ask(p, { title: `${mo} 月：${ev.name}`, body, options: opts, ai: pp => { const a = PERSONAS[pp.persona].react[kind]; return a[Math.floor(R() * a.length)]; } });
  const opt = opts.find(o => o.value === v && !o.disabled) || opts[2];
  p.reaction = { kind, choice: opt.value, label: opt.label.split('：')[0], mo, idxAt: m.index };
  if (opt.value === 'sell') STOCKS.forEach(s => { if (p.stocks[s.id] > 0) sellStock(p, s.id, p.stocks[s.id]); });
  if (opt.value === 'buy') { const q = Math.floor(half / (m.prices.ETF * 1.0015)); if (q > 0) buyStock(p, 'ETF', q); }
  if (opt.value === 'chase') { const q = Math.floor(half / (m.prices.TECH * 1.0015)); if (q > 0) buyStock(p, 'TECH', q); }
  if (opt.value === 'take') STOCKS.forEach(s => { const q = Math.floor(p.stocks[s.id] / 2); if (q > 0) sellStock(p, s.id, q); });
  IO.log(`${p.name} 在 ${mo} 月選擇「${p.reaction.label}」`, p.isHuman ? 'me' : '');
}

function reactionRecap(p) {
  const r = p.reaction; if (!r) return '';
  const after = G.market.index / r.idxAt - 1, rose = after > 0.01, fell = after < -0.01;
  const base = `你在 ${r.mo} 月選擇「${r.label}」。之後到年底，指數又 <b class="${after >= 0 ? 'up' : 'down'}">${pct(after)}</b>。`;
  const msg = {
    sell: rose ? '你賣在相對低點，錯過了之後的反彈。恐慌時賣出，常常是把帳面損失變成真正的損失。' : fell ? '這次賣出避開了後續的下跌，但沒有人能每次都猜對時機。' : '市場之後大致持平。',

// ================= 遊戲引擎 =================
let G = null, IO = null;
const R = Math.random;
function gauss() { let u = 0, v = 0; while (!u) u = R(); while (!v) v = R(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function wpick(arr) { const tot = arr.reduce((s, x) => s + (x.w || 1), 0); let r = R() * tot; for (const x of arr) { r -= (x.w || 1); if (r <= 0) return x; } return arr[arr.length - 1]; }
function money(n) {
  if (!isFinite(n)) return '—';
  const neg = n < 0; n = Math.abs(n); let s;
  if (n >= 1e8) s = (n / 1e8).toFixed(2).replace(/\.?0+$/, '') + ' 億';
  else if (n >= 1e4) s = (n / 1e4).toFixed(n >= 1e6 ? 0 : 1).replace(/\.0$/, '') + ' 萬';
  else s = Math.round(n).toLocaleString() + ' 元';
  return (neg ? '-' : '') + s;
}
function pct(x, d = 1) { return (x >= 0 ? '+' : '') + (x * 100).toFixed(d) + '%'; }
function amort(P, r, n) { if (P <= 0) return 0; if (n <= 1) return P * (1 + r); return P * r / (1 - Math.pow(1 + r, -n)); }
function round2(x) { return Math.round(x * 100) / 100; }

function drawEvent() {
  const m = G.market, follow = (m.event && m.event.follow) || {}, recent = m.recentEvents || [];
  const pool = EVENTS.map(ev => { let w = (ev.w || 0) + (follow[ev.id] || 0); if (ev.id !== 'calm' && recent.includes(ev.id)) w *= 0.15; return { ev, w }; }).filter(x => x.w > 0);
  return wpick(pool).ev;
}

// ---------- 價格與計算工具 ----------
const mortRate = () => G.market.rate + 0.012;
const depositRate = () => Math.max(0.001, G.market.rate * 0.45);
const bondYield = type => G.market.rate + BOND_TYPES[type].spread;
function bondUnitPrice(lot) { const D = Math.min(BOND_TYPES[lot.type].years, lot.yearsLeft) * 0.85; return BOND_FACE * clamp(1 + D * (lot.coupon - bondYield(lot.type)), 0.6, 1.35); }
const futPrice = type => (type === 'IDX' ? G.market.index : G.market.gold);
const futMarginPer = type => futPrice(type) * FUTURES[type].mult * 0.1;
function fxBuyRate(cur, p) { return G.market.fx[cur] * (1 + CURRENCIES[cur].spread * (p && p.fxDiscount ? 0.5 : 1)); }
function fxSellRate(cur, p) { return G.market.fx[cur] * (1 - CURRENCIES[cur].spread * (p && p.fxDiscount ? 0.5 : 1)); }
const propMarketPrice = idx => TILES[idx].price * WAN * G.market.propIdx;
const levelMult = l => [1, 1.3, 1.6][l];
const propRent = pr => pr.value * TILES[pr.tile].yield * levelMult(pr.level);
const premium = p => 1.2 * WAN * (1 + Math.max(0, p.age - 20) * 0.04) * G.market.infl;
function jobSalary(p, j) { return j.salary * WAN * G.market.infl * (1 + 0.02 * Math.min(p.workYears, 20)); }
function mortgagePay(p) { return p.props.reduce((s, x) => s + (x.loan > 0 ? amort(x.loan, mortRate(), x.years) : 0), 0); }

function incomeTax(inc) {
  const infl = G.market.infl; let t = Math.max(0, inc - 42 * WAN * infl), tax = 0;
  for (const [w, r] of [[59, 0.05], [74, 0.12], [133, 0.2], [250, 0.3], [Infinity, 0.4]]) { const seg = Math.min(t, w * WAN * infl); tax += seg * r; t -= seg; if (t <= 0) break; }
  return tax;
}

function holdings(p) {
  const m = G.market;
  const stocks = STOCKS.reduce((s, x) => s + (p.stocks[x.id] || 0) * m.prices[x.id], 0);
  const bonds = p.bonds.reduce((s, l) => s + bondUnitPrice(l) * l.units, 0);
  const fut = p.futures.reduce((s, f) => s + f.margin, 0);
  const fx = Object.keys(p.fx).reduce((s, c) => s + p.fx[c] * m.fx[c], 0);
  const props = p.props.reduce((s, x) => s + x.value, 0), items = itemsValue(p) + dreamsValue(p);
  const biz = p.biz.reduce((s, b) => s + bizValue(b), 0);
  const mort = p.props.reduce((s, x) => s + x.loan, 0);
  const assets = p.cash + stocks + bonds + fut + fx + props + biz + items;
  const liab = mort + p.studentLoan + p.credit;
  return { cash: p.cash, stocks, bonds, fut, fx, props, biz, items, assets, mort, liab, net: assets - liab };
}

const LIFE_MULT = { frugal: 0.86, normal: 1, enjoy: 1.26 };
// 計算一年的收支。actualBiz 傳入時使用實際事業利潤，否則用預估值
function cashflow(p, actualBiz) {
  const m = G.market, infl = m.infl, A = [], P = [], E = [];
  const push = (arr, label, v, rec) => { if (Math.abs(v) >= 1) arr.push({ label, v, rec: !!rec }); };
  let salary = 0;
  if (p.status === 'employed') { salary = p.salary * (p.plan === 'overtime' ? 1.15 : 1); push(A, p.plan === 'overtime' ? '薪資（含加班）' : '薪資', salary); }
  if (p.status === 'student' && p.plan === 'work') push(A, '打工收入', 12 * WAN * infl);
  if (p.status === 'student' && p.plan === 'gig') push(A, '接案收入', gigIncome(p));
  if (p.status === 'unemployed' && p.plan === 'gig') push(A, p.edu >= 55 ? '接案收入' : '打零工收入', gigIncome(p));
  if (p.married && p.partner) push(A, `配偶收入（${p.partner.name}）`, partnerIncome(p.partner));

  push(P, '股票股利', STOCKS.reduce((s, x) => s + (p.stocks[x.id] || 0) * m.prices[x.id] * x.div, 0));
  push(P, '債券利息', p.bonds.reduce((s, l) => s + l.units * BOND_FACE * l.coupon, 0));
  push(P, '房租收入', p.props.reduce((s, x) => s + propRent(x), 0));
  p.biz.forEach((b, i) => {
    const v = actualBiz ? actualBiz[i] : (b.lastProfit != null ? b.lastProfit : bizExpected(p, b));
    if (b.manager || v < 0) push(P, bizName(b) + '利潤', v);
    else { push(P, bizName(b) + '利潤（被動部分）', v * PASSIVE_SHARE); push(A, bizName(b) + '（自己經營）', v * (1 - PASSIVE_SHARE)); }
  });
  push(P, '夢想事業收益', dreamIncome(p));
  push(P, '台幣存款利息', Math.max(0, p.cash) * depositRate());
  push(P, '外幣存款利息', Object.keys(p.fx).reduce((s, c) => s + p.fx[c] * CURRENCIES[c].interest * m.fx[c], 0));

  const lm = LIFE_MULT[p.lifestyle];
  const creepBase = Math.min(salary, 80 * WAN * infl), creepHigh = Math.max(0, salary - 80 * WAN * infl);
  const living = p.status === 'student' ? 10 * WAN * infl * lm
    : (20 + (p.married ? 11 : 0) + (p.partner ? 2 : 0)) * WAN * infl * lm * (p.partner ? 1 + VALUES[p.partner.values].spend : 1) + (creepBase * 0.13 + creepHigh * 0.2) * lm;
  push(E, '生活費', living, true);
  if (p.status === 'student') push(E, '學費', (p.gradSchool ? 8 : 5) * (p.major ? MAJORS[p.major].tuition : 1) * WAN * infl);
  push(E, '房貸本息', mortgagePay(p), true);
  if (p.studentLoan > 0 && p.status !== 'student') push(E, '學貸本息', amort(p.studentLoan, 0.015, Math.max(1, p.studentLoanYears)), true);
  push(E, '子女養育與教育', kidCost(p), true);
  push(E, '感情經營', dateCost(p), true);
  push(E, '子女扶養費', p.alimony || 0, true);
  if (p.insured) push(E, '醫療險保費', premium(p), true);
  push(E, '車輛與精品維護', itemsUpkeep(p), true);
  push(E, '夢想清單維護', dreamsUpkeep(p), true);
  push(E, '健康方案', wellnessCost(p), true);
  if (p.credit > 0) push(E, '信用貸款本息', p.credit * 0.28, true);
  if (p.plan === 'learn') push(E, '進修學費', (p.status === 'employed' ? 6 : 3) * WAN * infl);
  push(E, '所得稅', incomeTax(salary));

  const sum = a => a.reduce((s, x) => s + x.v, 0);
  const totA = sum(A), totP = sum(P), totE = sum(E), rec = sum(E.filter(x => x.rec));
  return { A, P, E, totA, totP, totE, rec, net: totA + totP - totE };
}

// 接案收入完全看本事：學識越高接得到的案子越大
